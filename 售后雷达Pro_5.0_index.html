<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><title>售后雷达 Pro 5.0</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fb;color:#172033}button,input,select{font:inherit}button{border:0}.app{max-width:760px;margin:auto;padding:14px 14px 92px}.top{position:sticky;top:0;z-index:10;margin:-14px -14px 12px;padding:14px;background:rgba(244,247,251,.94);backdrop-filter:blur(12px);display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:20px}.sub{font-size:11px;color:#667085}.pill{font-size:11px;padding:6px 9px;border-radius:999px;background:#e8f7ee;color:#16834b;font-weight:800}.hero{background:linear-gradient(135deg,#111827,#334155);color:white;border-radius:22px;padding:18px;box-shadow:0 12px 30px #0f172a22}.hero h2{margin:0 0 5px;font-size:24px}.hero p{margin:0;color:#cbd5e1;font-size:13px}.actions{display:flex;gap:8px;margin-top:15px}.btn{padding:11px 13px;border-radius:12px;font-weight:800}.primary{background:white;color:#111827}.ghost{background:#ffffff18;color:white}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}.card{background:#fff;border-radius:17px;padding:14px;box-shadow:0 5px 18px #0f172a0d}.metric{font-size:27px;font-weight:900}.muted{color:#667085;font-size:12px}.danger{color:#dc2626}.warn{color:#d97706}.good{color:#059669}.tabs{display:flex;gap:7px;overflow:auto;padding:3px 0 10px}.tab{white-space:nowrap;padding:9px 12px;border-radius:999px;background:#e9edf3;font-weight:800;color:#475467}.tab.active{background:#111827;color:white}.toolbar{display:flex;gap:8px;margin-bottom:10px}.toolbar input,.toolbar select{flex:1;min-width:0;padding:11px;border:1px solid #e0e5ec;border-radius:12px;background:white}.event{padding:14px 0;border-bottom:1px solid #edf0f4}.event:last-child{border-bottom:0}.row{display:flex;justify-content:space-between;gap:10px}.tag{display:inline-block;padding:4px 7px;border-radius:7px;font-size:10px;font-weight:900;margin-right:5px;background:#eef2ff;color:#4f46e5}.tag.red{background:#fee2e2;color:#b91c1c}.tag.orange{background:#ffedd5;color:#c2410c}.tag.green{background:#dcfce7;color:#15803d}.click{cursor:pointer}.empty{text-align:center;padding:35px 10px;color:#98a2b3}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e7eaf0;display:flex;justify-content:center;z-index:20}.nav{max-width:760px;width:100%;display:grid;grid-template-columns:repeat(4,1fr)}.nav button{padding:10px 3px;background:white;color:#667085;font-size:11px}.nav button.on{color:#111827;font-weight:900}.nav b{display:block;font-size:17px;margin-bottom:2px}.page{display:none}.page.on{display:block}.modal{position:fixed;inset:0;background:#0007;z-index:50;display:none;align-items:flex-end}.modal.on{display:flex}.sheet{background:#fff;width:100%;max-height:86vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px}.close{float:right;background:#eef2f6;border-radius:10px;padding:8px}.line{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eef0f3}.switch{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #eef0f3}.switch input{width:22px;height:22px}.dangerBtn{width:100%;background:#fee2e2;color:#b91c1c;padding:13px;border-radius:12px;font-weight:900;margin-top:12px}
</style></head><body><div class="app">
<div class="top"><div><div class="brand">售后雷达 <span style="font-size:12px">PRO 5.0</span></div><div class="sub">移动端售后监控 · 模拟数据模式</div></div><span class="pill" id="statusPill">● 本地运行</span></div>
<section id="dashboard" class="page on"><div class="hero"><h2 id="heroTitle">今天的售后雷达</h2><p>自动汇总新增售后、拒绝协商、仲裁与高风险事件。</p><div class="actions"><button class="btn primary" onclick="generate()">＋ 模拟新事件</button><button class="btn ghost" onclick="refreshData()">↻ 刷新</button></div></div>
<div class="grid"><div class="card"><div class="muted">今日售后</div><div class="metric" id="mToday">0</div><div class="muted">较昨日 <span class="good">模拟</span></div></div><div class="card"><div class="muted">高风险</div><div class="metric danger" id="mRisk">0</div><div class="muted">需要重点关注</div></div><div class="card"><div class="muted">拒绝协商</div><div class="metric warn" id="mRefuse">0</div><div class="muted">买家未达成协商</div></div><div class="card"><div class="muted">仲裁</div><div class="metric" id="mArb">0</div><div class="muted">平台介入事件</div></div></div>
<div class="card"><div class="row"><b>风险分布</b><span class="muted">当前数据</span></div><div id="riskBars" style="margin-top:12px"></div></div>
<div class="card"><div class="row"><b>最新预警</b><button class="tab" onclick="showPage('events')">查看全部</button></div><div id="latest"></div></div></section>
<section id="events" class="page"><div class="card"><h2 style="margin:0 0 12px">售后事件</h2><div class="toolbar"><input id="search" placeholder="搜索订单/事件" oninput="renderEvents()"><select id="filter" onchange="renderEvents()"><option value="all">全部</option><option value="risk">高风险</option><option value="refuse">拒绝协商</option><option value="arb">仲裁</option><option value="new">新增售后</option></select></div><div id="eventList"></div></div></section>
<section id="stats" class="page"><div class="card"><h2 style="margin-top:0">数据统计</h2><div class="grid"><div class="card"><span class="muted">事件总数</span><div class="metric" id="sTotal">0</div></div><div class="card"><span class="muted">风险率</span><div class="metric danger" id="sRate">0%</div></div><div class="card"><span class="muted">仲裁率</span><div class="metric" id="sArb">0%</div></div><div class="card"><span class="muted">拒绝协商率</span><div class="metric" id="sRef">0%</div></div></div><div id="typeStats"></div></div></section>
<section id="settings" class="page"><div class="card"><h2 style="margin-top:0">设置</h2><div class="switch"><span>风险预警</span><input id="riskNotify" type="checkbox" checked onchange="saveSettings()"></div><div class="switch"><span>仲裁提醒</span><input id="arbNotify" type="checkbox" checked onchange="saveSettings()"></div><div class="switch"><span>自动刷新（30秒）</span><input id="autoRefresh" type="checkbox" onchange="toggleAutoRefresh()"></div><button class="dangerBtn" onclick="resetData()">清空本地测试数据</button></div><div class="card"><b>未来官方接入</b><p class="muted">5.0 保留 API 适配层。取得抖店官方应用授权后，可将模拟数据源替换为官方只读数据，不需要重做前端。</p></div></section>
</div><div class="bottom"><div class="nav"><button class="on" data-p="dashboard" onclick="showPage('dashboard',this)"><b>⌂</b>总览</button><button data-p="events" onclick="showPage('events',this)"><b>◫</b>事件</button><button data-p="stats" onclick="showPage('stats',this)"><b>◔</b>统计</button><button data-p="settings" onclick="showPage('settings',this)"><b>⚙</b>设置</button></div></div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><button class="close" onclick="closeModal()">关闭</button><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div>
<script>
const KEY='radar5_data',SET='radar5_settings';let data=JSON.parse(localStorage.getItem(KEY)||'null')||seed();let settings=Object.assign({riskNotify:true,arbNotify:true,autoRefresh:false},JSON.parse(localStorage.getItem(SET)||'{}'));let timer=null;
function seed(){const now=Date.now(),types=[['新增售后','new','low'],['拒绝协商','refuse','medium'],['仲裁','arb','high'],['高风险售后','risk','high']];return Array.from({length:18},(_,i)=>{let t=types[i%4];return{id:'AS'+(202610000+i),order:'DY'+(8392000+i),type:t[0],kind:t[1],risk:t[2],amount:[39,68,128,199,299][i%5],status:i%3?'处理中':'待处理',reason:['商品质量争议','退款金额协商失败','平台介入','物流异常'][i%4],time:new Date(now-i*43*60000).toISOString()}})}
function save(){localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem(SET,JSON.stringify(settings))}function fmt(x){return new Date(x).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}function stats(){let today=new Date().toDateString();let d=data.filter(x=>new Date(x.time).toDateString()===today);return{today:d.length,risk:data.filter(x=>x.risk==='high').length,ref:data.filter(x=>x.kind==='refuse').length,arb:data.filter(x=>x.kind==='arb').length}}
function refreshData(){render();}function render(){let s=stats();mToday.textContent=s.today;mRisk.textContent=s.risk;mRefuse.textContent=s.ref;mArb.textContent=s.arb;let total=data.length||1;sTotal.textContent=data.length;sRate.textContent=Math.round(s.risk/total*100)+'%';sArb.textContent=Math.round(s.arb/total*100)+'%';sRef.textContent=Math.round(s.ref/total*100)+'%';renderRisk();renderLatest();renderEvents();renderStats()}
function renderRisk(){let c={high:data.filter(x=>x.risk==='high').length,medium:data.filter(x=>x.risk==='medium').length,low:data.filter(x=>x.risk==='low').length};riskBars.innerHTML=Object.entries(c).map(([k,v])=>`<div style="margin:9px 0"><div class="row"><span>${k==='high'?'高风险':k==='medium'?'中风险':'低风险'}</span><b>${v}</b></div><div style="height:7px;background:#eef1f5;border-radius:9px;overflow:hidden"><div style="width:${Math.round(v/(data.length||1)*100)}%;height:100%;background:${k==='high'?'#ef4444':k==='medium'?'#f59e0b':'#10b981'}"></div></div></div>`).join('')}
function badge(x){return `<span class="tag ${x.risk==='high'?'red':x.risk==='medium'?'orange':'green'}">${x.risk==='high'?'高风险':x.risk==='medium'?'中风险':'低风险'}</span>`}
function card(x){return `<div class="event click" onclick="detail('${x.id}')"><div class="row"><div><b>${x.type}</b> ${badge(x)}</div><span class="muted">${fmt(x.time)}</span></div><div class="muted" style="margin-top:6px">订单 ${x.order} · ¥${x.amount} · ${x.reason}</div></div>`}
function renderLatest(){latest.innerHTML=data.slice().sort((a,b)=>b.time.localeCompare(a.time)).slice(0,5).map(card).join('')||'<div class="empty">暂无事件</div>'}
function renderEvents(){let q=(search.value||'').toLowerCase(),f=filter.value;let arr=data.filter(x=>(!q||(x.order+x.id+x.reason+x.type).toLowerCase().includes(q))&&(f==='all'||(f==='risk'&&x.risk==='high')||(f==='refuse'&&x.kind==='refuse')||(f==='arb'&&x.kind==='arb')||(f==='new'&&x.kind==='new'))).sort((a,b)=>b.time.localeCompare(a.time));eventList.innerHTML=arr.map(card).join('')||'<div class="empty">没有匹配的事件</div>'}
function renderStats(){let m={};data.forEach(x=>m[x.type]=(m[x.type]||0)+1);typeStats.innerHTML='<h3>事件类型</h3>'+Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="line"><span>${k}</span><b>${v}</b></div>`).join('')}
function detail(id){let x=data.find(a=>a.id===id);if(!x)return;modalTitle.textContent=x.type;modalBody.innerHTML=`<div class="line"><span>事件编号</span><b>${x.id}</b></div><div class="line"><span>订单号</span><b>${x.order}</b></div><div class="line"><span>风险等级</span><b class="${x.risk==='high'?'danger':x.risk==='medium'?'warn':'good'}">${x.risk==='high'?'高风险':x.risk==='medium'?'中风险':'低风险'}</b></div><div class="line"><span>金额</span><b>¥${x.amount}</b></div><div class="line"><span>状态</span><b>${x.status}</b></div><div class="line"><span>原因</span><b>${x.reason}</b></div><div class="line"><span>发生时间</span><b>${fmt(x.time)}</b></div><p class="muted">当前为本地模拟数据，不执行退款、驳回、审核等自动售后操作。</p>`;modal.classList.add('on')}
function closeModal(){modal.classList.remove('on')}function generate(){let n=Date.now(),k=[['新增售后','new','low'],['拒绝协商','refuse','medium'],['仲裁','arb','high'],['高风险售后','risk','high']][Math.floor(Math.random()*4)];data.unshift({id:'AS'+String(n).slice(-8),order:'DY'+String(Math.floor(Math.random()*9000000+1000000)),type:k[0],kind:k[1],risk:k[2],amount:[29,59,99,168,299][Math.floor(Math.random()*5)],status:'待处理',reason:['商品质量争议','退款金额协商失败','平台介入','物流异常','超时风险'][Math.floor(Math.random()*5)],time:new Date().toISOString()});save();render();if((k[2]==='high'&&settings.riskNotify)||(k[1]==='arb'&&settings.arbNotify))navigator.vibrate?.([100,60,100]);showPage('dashboard')}
function showPage(id,btn){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x.dataset.p===id));render()}
function resetData(){if(confirm('确定清空所有本地测试数据？')){data=[];save();render()}}function saveSettings(){settings.riskNotify=riskNotify.checked;settings.arbNotify=arbNotify.checked;save()}function toggleAutoRefresh(){settings.autoRefresh=autoRefresh.checked;save();if(timer)clearInterval(timer);if(settings.autoRefresh)timer=setInterval(()=>{generate()},30000)}riskNotify.checked=settings.riskNotify;arbNotify.checked=settings.arbNotify;autoRefresh.checked=settings.autoRefresh;toggleAutoRefresh();render();
</script></body></html>
