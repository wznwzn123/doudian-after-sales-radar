<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>售后雷达 Pro 5.0 · 云端工作台</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f3f5f9;--surface:#fff;--text:#121827;--muted:#718096;--line:#e5e9f0;--blue:#2563eb;--green:#0f9d62;--red:#d63b3b;--shadow:0 10px 30px rgba(15,23,42,.07)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.top{position:sticky;top:0;z-index:30;background:#0b1020;color:#fff;padding:11px 14px}.toprow{max-width:1180px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}.brandline{display:flex;align-items:center;gap:9px}.logo{width:38px;height:38px;border-radius:12px;background:#fff;display:grid;place-items:center;color:#111827;font-weight:950}.brand{font-size:18px;font-weight:900}.sub{font-size:11px;color:#aeb7c8;margin-top:2px}.authbar{display:flex;align-items:center;gap:7px}.email{font-size:12px;color:#c8d0dc;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{max-width:1180px;margin:auto;padding:16px 14px 48px}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-bottom:14px}.heroCard{background:linear-gradient(135deg,#111827,#243047);color:#fff;border-radius:22px;padding:20px}.hero h1{margin:0;font-size:26px}.hero p{margin:8px 0;color:#c5ccda;font-size:13px}.heroActions,.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.heroMini{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini,.stat,.item,.section,.login{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}.mini{border-radius:18px;padding:14px}.mini .k,.stat .l{font-size:12px;color:var(--muted)}.mini .v{font-size:22px;font-weight:900;margin-top:3px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.stat{border-radius:16px;padding:14px}.stat .n{font-size:24px;font-weight:950}.toolbar{background:#fff;border:1px solid var(--line);border-radius:18px;padding:11px;display:grid;grid-template-columns:1fr 150px 130px auto;gap:8px}.input,select,textarea{width:100%;border:1px solid #dfe4ec;background:#fff;color:var(--text);border-radius:12px;padding:10px 11px;outline:0}.btn{padding:10px 13px;border-radius:12px;background:#edf1f6;color:#1c2637;font-weight:800}.btn.primary{background:#111827;color:#fff}.btn.blue{background:#e8efff;color:#1d4ed8}.btn.good{background:#e7f8ef;color:#11754a}.btn.warn{background:#fff3dc;color:#8a5b00}.btn.danger{background:#ffe8e8;color:#a92323}.btn.ghost{background:transparent;color:#d5dbea;border:1px solid rgba(255,255,255,.16)}
.list{display:grid;gap:10px;margin-top:12px}.item{border-radius:18px;padding:14px}.itemhead{display:flex;justify-content:space-between;gap:10px}.title{font-size:15px;font-weight:900}.meta,.muted{font-size:12px;color:var(--muted)}.tags{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.tag{display:inline-flex;padding:5px 8px;border-radius:999px;background:#eef2f7;font-size:11px;font-weight:800}.tag.red{background:#ffe9e9;color:#a92323}.tag.green{background:#e6f8ef;color:#11754a}.tag.amber{background:#fff2d5;color:#8a5b00}.tag.blue{background:#e8efff;color:#1d4ed8}.deadline{display:flex;justify-content:space-between;margin-top:8px;font-size:12px}.countdown{font-weight:950}.dangertext{color:var(--red)}.empty{padding:38px 15px;text-align:center;background:#fff;border:1px dashed #ccd3de;border-radius:18px;color:var(--muted)}
.nav{display:flex;gap:7px;overflow:auto;margin:12px 0}.nav .btn{white-space:nowrap}.nav .active{background:#111827;color:#fff}.drawer{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.48);display:flex;justify-content:flex-end}.sheet{height:100%;width:min(760px,100%);background:#fff;overflow:auto}.sheetHead{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid var(--line);padding:13px 14px;display:flex;justify-content:space-between}.sheetBody{padding:14px}.section{border-radius:16px;padding:13px;margin-bottom:12px}.section h3{margin:0 0 10px;font-size:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{margin-bottom:9px}.field label{display:block;font-size:12px;color:#657187;margin-bottom:5px}.drop{border:1px dashed #aeb8c7;border-radius:14px;padding:17px;text-align:center;background:#f8fafc}.notice{padding:10px 12px;border-radius:12px;background:#f5f7fa;font-size:12px;color:#5f6c80}.notice.warn{background:#fff6e4;color:#805800}.modal{position:fixed;inset:0;z-index:70;background:rgba(15,23,42,.48);display:grid;place-items:center;padding:16px}.modalBox{background:#fff;border-radius:20px;width:min(760px,100%);max-height:90vh;overflow:auto;padding:18px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:100;background:#111827;color:#fff;padding:11px 15px;border-radius:12px;font-size:13px}.login{max-width:440px;margin:8vh auto;padding:20px;border-radius:22px}.login h2{margin-top:22px}.authmsg{padding:9px;border-radius:10px;font-size:12px;margin:8px 0}.authmsg.err{background:#fff0f0;color:#a92323}.authmsg.ok{background:#eaf8f0;color:#11754a}.adminTable{width:100%;border-collapse:collapse;font-size:12px}.adminTable th,.adminTable td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.adminTable th{color:var(--muted)}.adminPill{display:inline-flex;padding:4px 7px;border-radius:999px;background:#e7f8ef;color:#11754a;font-weight:800}
@media(max-width:760px){.hero{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr 1fr}.toolbar .search{grid-column:1/-1}.grid2{grid-template-columns:1fr}.email{display:none}}
</style>
</head>
<body>
<div id="loginView" class="login">
<div class="brandline"><div class="logo">雷</div><div><div class="brand">售后雷达 Pro 5.0</div><div class="sub">云端售后 · 证据 · 3小时风险管控</div></div></div>
<h2>进入云端工作台</h2><p class="muted">数据保存到 Supabase 云端，可跨设备继续处理。</p>
<div class="field"><label>邮箱</label><input id="email" class="input" type="email"></div>
<div class="field"><label>密码</label><input id="password" class="input" type="password"></div>
<div id="passwordConfirmWrap" class="field hidden"><label>确认密码</label><input id="passwordConfirm" class="input" type="password"></div>
<div class="notice">密码至少8位，含大写、小写、数字和特殊字符。</div>
<div id="authMsg" class="hidden"></div><div class="actions"><button class="btn primary" onclick="login()">登录</button><button class="btn" onclick="register()">注册</button><button class="btn blue" onclick="forgotPassword()">找回密码</button></div>
</div>

<div id="resetView" class="login hidden"><div class="brandline"><div class="logo">雷</div><div><div class="brand">售后雷达 Pro 5.0</div><div class="sub">安全重置密码</div></div></div><h2>设置新密码</h2><input id="resetPassword" class="input" type="password" placeholder="新密码"><br><br><input id="resetPasswordConfirm" class="input" type="password" placeholder="确认新密码"><div id="resetMsg" class="hidden"></div><div class="actions"><button class="btn primary" onclick="updatePassword()">保存</button><button class="btn" onclick="backToLogin()">返回</button></div></div>

<div id="app" class="hidden">
<header class="top"><div class="toprow"><div class="brandline"><div class="logo">雷</div><div><div class="brand">售后雷达 Pro 5.0</div><div class="sub">云端工作台 · 数据已同步</div></div></div><div class="authbar"><span id="syncState" class="sub">云端在线 · 在线 <b id="onlineCount">0</b></span><span id="userEmail" class="email"></span><button id="adminBtn" class="btn ghost hidden" onclick="openAdminPanel()">管理后台</button><button class="btn ghost" onclick="openSettings()">设置</button><button class="btn ghost" onclick="signOut()">退出</button></div></div></header>
<main class="wrap">
<section class="hero"><div class="heroCard"><h1>今天的售后，先处理高风险。</h1><p>拒绝协商、仲裁、举证、3小时倒计时与云端证据统一管理。</p><div class="heroActions"><button class="btn" onclick="newTask()">＋ 新建售后</button><button class="btn" onclick="quickReject()">记录拒绝协商</button><button class="btn" onclick="refreshAll()">↻ 同步云端</button></div></div><div class="heroMini"><div class="mini"><div class="k">最紧急任务</div><div class="v" id="urgent">—</div></div><div class="mini"><div class="k">今日完成</div><div class="v" id="doneToday">0</div></div><div class="mini"><div class="k">盯单中</div><div class="v" id="monitoring">0</div></div><div class="mini"><div class="k">证据文件</div><div class="v" id="evidenceCount">0</div></div></div></section>
<div class="stats"><div class="stat"><div class="n" id="cAll">0</div><div class="l">全部售后</div></div><div class="stat"><div class="n" id="cPending">0</div><div class="l">待处理</div></div><div class="stat"><div class="n" id="cEvidence">0</div><div class="l">待举证</div></div><div class="stat"><div class="n" id="cRisk">0</div><div class="l">高风险</div></div></div>
<div class="nav"><button class="btn active" onclick="setQuickFilter('')">全部</button><button class="btn" onclick="setQuickFilter('risk')">高风险</button><button class="btn" onclick="setQuickFilter('待举证')">待举证</button><button class="btn" onclick="setQuickFilter('仲裁中')">仲裁中</button><button class="btn" onclick="setQuickFilter('已完成')">已完成</button></div>
<div class="toolbar"><input id="search" class="input search" placeholder="搜索订单 / 买家 / 快递单号" oninput="render()"><select id="filter" onchange="render()"><option value="">全部状态</option><option>待处理</option><option>协商中</option><option>买家拒绝协商</option><option>待举证</option><option>仲裁中</option><option>已完成</option></select><select id="riskFilter" onchange="render()"><option value="">全部风险</option><option>普通</option><option>高风险</option></select><button class="btn primary" onclick="newTask()">＋ 新建</button></div>
<div id="list" class="list"></div>
</main></div>

<div id="drawer" class="drawer hidden" onclick="if(event.target===this)closeTask()"><section class="sheet"><div class="sheetHead"><div><b id="sheetTitle">售后详情</b><div id="sheetSub" class="muted"></div></div><button class="btn" onclick="closeTask()">关闭</button></div><div class="sheetBody" id="detailBody"></div></section></div>
<div id="modal" class="modal hidden"><div class="modalBox" id="modalBox"></div></div><div id="toast" class="toast hidden"></div>

<script>
const CONFIG={SUPABASE_URL:"https://bdnazzywqqmliqyhhtig.supabase.co",SUPABASE_KEY:"sb_publishable_AUD55Xac5eZXmNtcblkgcQ_Y4D-MYk9"};
const sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_KEY);
let session=null,tasks=[],current=null,timer=null,rt=null,presenceChannel=null,isAdmin=false,fileCache=[],eventsCache=[],quick="";
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=v=>v?new Date(v).toLocaleString("zh-CN",{hour12:false}):"—";
const strong=p=>p.length>=8&&/[A-Z]/.test(p)&&/[a-z]/.test(p)&&/\d/.test(p)&&/[^A-Za-z0-9]/.test(p);
function toast(s,type=""){const e=$("toast");e.textContent=s;e.className="toast "+type;e.classList.remove("hidden");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.add("hidden"),2800)}
function msg(id,s,ok=false){$(id).className="authmsg "+(ok?"ok":"err");$(id).textContent=s}
async function login(){const email=$("email").value.trim(),password=$("password").value;if(!email||!password)return msg("authMsg","请输入邮箱和密码");const {error}=await sb.auth.signInWithPassword({email,password});if(error)msg("authMsg",error.message)}
async function register(){const e=$("email").value.trim(),p=$("password").value,c=$("passwordConfirm").value;$("passwordConfirmWrap").classList.remove("hidden");if(!e)return msg("authMsg","请输入邮箱");if(!strong(p))return msg("authMsg","密码不符合要求");if(p!==c)return msg("authMsg","两次密码不一致");const {error}=await sb.auth.signUp({email:e,password:p});if(error)msg("authMsg",error.message);else msg("authMsg","注册成功，请检查邮箱验证。",true)}
async function forgotPassword(){const e=$("email").value.trim();if(!e)return msg("authMsg","请输入邮箱");const {error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.href.split("#")[0]});if(error)msg("authMsg",error.message);else msg("authMsg","重置邮件已发送。",true)}
async function updatePassword(){const p=$("resetPassword").value,c=$("resetPasswordConfirm").value;if(!strong(p))return msg("resetMsg","密码不符合要求");if(p!==c)return msg("resetMsg","两次密码不一致");const {error}=await sb.auth.updateUser({password:p});if(error)msg("resetMsg",error.message);else{msg("resetMsg","密码已更新。",true);setTimeout(backToLogin,900)}}
function backToLogin(){$("resetView").classList.add("hidden");$("loginView").classList.remove("hidden")}
async function checkAdmin(){const {data,error}=await sb.rpc("is_admin");isAdmin=!error&&data===true;$("adminBtn").classList.toggle("hidden",!isAdmin)}
async function init(){const r=await sb.auth.getSession();session=r.data.session;if(session)showApp();else $("loginView").classList.remove("hidden");sb.auth.onAuthStateChange((event,s)=>{session=s;if(event==="PASSWORD_RECOVERY"){$("loginView").classList.add("hidden");$("app").classList.add("hidden");$("resetView").classList.remove("hidden");return}if(s)showApp();else{tasks=[];$("app").classList.add("hidden");$("loginView").classList.remove("hidden")}})}
async function showApp(){$("loginView").classList.add("hidden");$("resetView").classList.add("hidden");$("app").classList.remove("hidden");$("userEmail").textContent=session.user.email;await checkAdmin();await refreshAll();subscribe();startPresence();startTimer()}
async function signOut(){stopPresence();if(rt)sb.removeChannel(rt);await sb.auth.signOut()}
async function refreshAll(){const {data,error}=await sb.from("after_sales_tasks").select("*").order("created_at",{ascending:false});if(error)return toast(error.message,"err");tasks=data||[];const {data:f}=await sb.from("evidence_files").select("id");$("evidenceCount").textContent=(f||[]).length;$("monitoring").textContent=tasks.filter(t=>t.monitoring).length;$("cAll").textContent=tasks.length;$("cPending").textContent=tasks.filter(t=>["待处理","协商中"].includes(t.status)).length;$("cEvidence").textContent=tasks.filter(t=>t.status==="待举证").length;$("cRisk").textContent=tasks.filter(t=>t.risk==="高风险").length;render()}
function subscribe(){if(rt)sb.removeChannel(rt);rt=sb.channel("after-sales-live").on("postgres_changes",{event:"*",schema:"public",table:"after_sales_tasks",filter:`user_id=eq.${session.user.id}`},refreshAll).subscribe()}
function startTimer(){clearInterval(timer);timer=setInterval(()=>{document.querySelectorAll("[data-id]").forEach(e=>{const t=tasks.find(x=>x.id===e.dataset.id);if(t)e.textContent=count(t)});},1000)}
function count(t){if(t.status==="已完成"||t.submission_status!=="pending")return"已完成 · 倒计时已停止";if(!t.deadline)return"未设置";let x=new Date(t.deadline)-Date.now();if(x<=0)return"已到期";let s=Math.floor(x/1000),h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60),q=s%60;return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(q).padStart(2,"0")}`}
function setQuickFilter(v){quick=v;render()}
function render(){const q=$("search").value.toLowerCase(),f=$("filter").value,r=$("riskFilter").value;let a=tasks.filter(t=>(!q||[t.order_id,t.buyer_name,t.tracking_no,t.reason].join(" ").toLowerCase().includes(q))&&(!f||t.status===f)&&(!r||t.risk===r)&&(quick==="risk"?t.risk==="高风险":!quick||t.status===quick));$("list").innerHTML=a.length?a.map(card).join(""):`<div class="empty">没有匹配的售后</div>`}
function card(t){return `<article class="item"><div class="itemhead"><div><div class="title">${esc(t.order_id||"未填写订单号")}</div><div class="meta">${esc(t.buyer_name||"未填写买家")} · ${esc(t.tracking_no||"无快递单号")}</div></div><div class="tags"><span class="tag ${t.status==="已完成"?"green":"blue"}">${esc(t.status)}</span><span class="tag ${t.risk==="高风险"?"red":""}">${esc(t.risk||"普通")}</span></div></div><div class="deadline"><span>举证倒计时</span><span class="countdown ${t.risk==="高风险"?"dangertext":""}" data-id="${t.id}">${count(t)}</span></div><div class="actions"><button class="btn primary" onclick="openTask('${t.id}')">打开详情</button><button class="btn warn" onclick="reject('${t.id}')">拒绝协商</button><button class="btn" onclick="tracking('${t.id}')">${t.tracking_no?(t.monitoring?"停止盯单":"继续盯单"):"输入快递号"}</button></div></article>`}
async function newTask(){const {data,error}=await sb.from("after_sales_tasks").insert({user_id:session.user.id,status:"待处理",risk:"普通",after_sales_type:"退款/售后",submission_status:"pending",monitoring:false,deadline:new Date(Date.now()+10800000).toISOString()}).select().single();if(error)return toast(error.message,"err");await refreshAll();openTask(data.id)}
async function quickReject(){const {data,error}=await sb.from("after_sales_tasks").insert({user_id:session.user.id,status:"待举证",risk:"高风险",after_sales_type:"退款/售后",submission_status:"pending",monitoring:false,deadline:new Date(Date.now()+10800000).toISOString()}).select().single();if(error)return toast(error.message,"err");await sb.from("after_sales_events").insert({user_id:session.user.id,task_id:data.id,event_type:"rejected_negotiation",message:"买家拒绝协商，进入举证阶段"});await refreshAll();openTask(data.id)}
async function reject(id){const {error}=await sb.from("after_sales_tasks").update({status:"待举证",risk:"高风险",submission_status:"pending",deadline:new Date(Date.now()+10800000).toISOString(),updated_at:new Date().toISOString()}).eq("id",id);if(error)return toast(error.message,"err");await sb.from("after_sales_events").insert({user_id:session.user.id,task_id:id,event_type:"rejected_negotiation",message:"买家拒绝协商，启动3小时举证倒计时"});await refreshAll()}
async function openTask(id){current=tasks.find(x=>x.id===id);if(!current)return;const [{data:f},{data:e}]=await Promise.all([sb.from("evidence_files").select("*").eq("task_id",id).order("created_at"),sb.from("after_sales_events").select("*").eq("task_id",id).order("created_at",{ascending:false})]);fileCache=f||[];eventsCache=e||[];$("sheetTitle").textContent=current.order_id||"售后详情";$("sheetSub").textContent=`${current.buyer_name||"未填写买家"} · ${current.status}`;$("detailBody").innerHTML=detailHTML(current);$("drawer").classList.remove("hidden")}
function closeTask(){$("drawer").classList.add("hidden");current=null}
function detailHTML(t){return `<div class="section"><div class="notice ${t.risk==="高风险"?"warn":""}">${count(t)}</div></div><div class="section"><h3>基础信息</h3><div class="grid2"><div class="field"><label>订单号</label><input id="order" class="input" value="${esc(t.order_id)}"></div><div class="field"><label>买家</label><input id="buyer" class="input" value="${esc(t.buyer_name)}"></div><div class="field"><label>快递单号</label><input id="track" class="input" value="${esc(t.tracking_no)}"></div><div class="field"><label>售后类型</label><input id="type" class="input" value="${esc(t.after_sales_type)}"></div></div><div class="grid2"><div class="field"><label>状态</label><select id="status">${["待处理","协商中","买家拒绝协商","待举证","仲裁中","已完成"].map(x=>`<option ${x===t.status?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label>风险</label><select id="risk"><option ${t.risk==="普通"?"selected":""}>普通</option><option ${t.risk==="高风险"?"selected":""}>高风险</option></select></div></div><div class="field"><label>售后原因</label><textarea id="reason" rows="3">${esc(t.reason)}</textarea></div><div class="field"><label>举证理由</label><textarea id="evidence" rows="6">${esc(t.evidence_reason)}</textarea></div><div class="actions"><button class="btn primary" onclick="saveTask()">保存</button><button class="btn good" onclick="submitCurrent()">提交举证</button><button class="btn danger" onclick="deleteTask()">删除</button></div></div><div class="section"><h3>举证材料</h3><div class="drop"><input id="filesInput" type="file" multiple accept="image/*,video/*,.pdf,.doc,.docx,.txt" onchange="uploadFiles(this.files)"><div class="muted">上传后保存到云端。</div></div><div id="files" style="margin-top:10px">${fileCache.map(f=>`<div class="notice" style="margin:5px 0">${esc(f.file_name)} <button class="btn danger" onclick="removeFile('${f.id}')">删除</button></div>`).join("")||'<div class="muted">暂无材料</div>'}</div></div><div class="section"><h3>操作时间线</h3>${eventsCache.map(e=>`<div style="padding:7px 0;border-bottom:1px solid #eee"><b>${esc(e.message)}</b><div class="muted">${fmt(e.created_at)}</div></div>`).join("")||'<div class="muted">暂无事件</div>'}</div>`}
async function saveTask(){const p={order_id:$("order").value.trim(),buyer_name:$("buyer").value.trim(),tracking_no:$("track").value.trim(),after_sales_type:$("type").value.trim(),status:$("status").value,risk:$("risk").value,reason:$("reason").value,evidence_reason:$("evidence").value,updated_at:new Date().toISOString()};if(p.status==="已完成")p.submission_status="submitted_manual";const {error}=await sb.from("after_sales_tasks").update(p).eq("id",current.id);if(error)return toast(error.message,"err");await refreshAll();openTask(current.id);toast("已保存","ok")}
async function submitCurrent(){const {data:f}=await sb.from("evidence_files").select("id").eq("task_id",current.id);if(!f?.length)return toast("请先上传举证材料","err");const {error}=await sb.from("after_sales_tasks").update({status:"已完成",submission_status:"submitted_manual",updated_at:new Date().toISOString()}).eq("id",current.id);if(error)return toast(error.message,"err");await refreshAll();openTask(current.id);toast("提交完成，倒计时已停止","ok")}
async function uploadFiles(list){for(const file of [...list]){const path=`${session.user.id}/${current.id}/${crypto.randomUUID()}-${file.name.replace(/[^\w.\-\u4e00-\u9fa5]/g,"_")}`;const u=await sb.storage.from("after-sales-evidence").upload(path,file,{contentType:file.type||"application/octet-stream"});if(u.error)return toast(u.error.message,"err");const x=await sb.from("evidence_files").insert({user_id:session.user.id,task_id:current.id,file_name:file.name,mime_type:file.type,size_bytes:file.size,storage_path:path});if(x.error)return toast(x.error.message,"err")}await refreshAll();openTask(current.id)}
async function removeFile(id){const f=fileCache.find(x=>x.id===id);if(!f)return;await sb.storage.from("after-sales-evidence").remove([f.storage_path]);await sb.from("evidence_files").delete().eq("id",id);await refreshAll();openTask(current.id)}
async function deleteTask(){if(!confirm("确定删除？"))return;const {error}=await sb.from("after_sales_tasks").delete().eq("id",current.id);if(error)return toast(error.message,"err");closeTask();await refreshAll()}
async function tracking(id){const t=tasks.find(x=>x.id===id);if(!t)return;let n=t.tracking_no;if(!n){n=prompt("输入快递单号");if(!n)return}const on=!t.monitoring;await sb.from("after_sales_tasks").update({tracking_no:n.trim(),monitoring:on}).eq("id",id);await sb.from("tracking_records").insert({user_id:session.user.id,task_id:id,tracking_no:n.trim(),monitoring:on});await refreshAll()}
function openSettings(){$("modalBox").innerHTML=`<div class="actions" style="justify-content:space-between"><b>设置</b><button class="btn" onclick="closeModal()">关闭</button></div><div class="section"><b>账号</b><div class="muted">${esc(session.user.email)}</div></div><div class="section"><b>云端项目</b><div class="muted">${CONFIG.SUPABASE_URL}</div></div>`;$("modal").classList.remove("hidden")}
function closeModal(){$("modal").classList.add("hidden")}
function startPresence(){
  if(!session)return;
  if(presenceChannel){sb.removeChannel(presenceChannel);presenceChannel=null}
  presenceChannel=sb.channel("after-sales-presence",{config:{presence:{key:session.user.id}}});
  presenceChannel.on("presence",{event:"sync"},updateOnlineCount);
  presenceChannel.on("presence",{event:"join"},updateOnlineCount);
  presenceChannel.on("presence",{event:"leave"},updateOnlineCount);
  presenceChannel.subscribe(async status=>{
    if(status==="SUBSCRIBED"){await presenceChannel.track({user_id:session.user.id,online_at:new Date().toISOString()});updateOnlineCount();}
  });
}
function updateOnlineCount(){
  if(!presenceChannel)return;
  const state=presenceChannel.presenceState();
  const ids=new Set();
  Object.keys(state||{}).forEach(k=>{const arr=state[k]||[];arr.forEach(x=>ids.add(x.user_id||k))});
  $("onlineCount").textContent=String(ids.size);
  window.__onlineUsers=[...ids].map(id=>({id}));
}
function stopPresence(){if(presenceChannel){sb.removeChannel(presenceChannel);presenceChannel=null}if($("onlineCount"))$("onlineCount").textContent="0"}

/* 管理后台 Pro：总览 / 用户 / 售后 / 证据 / 快递 / 管理员 / 日志 / 设置 */
let adminTab='overview';
async function openAdminPanel(){
 if(!isAdmin)return toast('没有管理员权限','err');
 $('modalBox').innerHTML=`<div class="actions" style="justify-content:space-between"><b>售后雷达 Pro · 管理控制台</b><button class="btn" onclick="closeModal()">关闭</button></div><div class="nav" id="adminNav"><button class="btn active" onclick="adminTabOpen('overview')">总览</button><button class="btn" onclick="adminTabOpen('users')">用户管理</button><button class="btn" onclick="adminTabOpen('tasks')">售后管理</button><button class="btn" onclick="adminTabOpen('evidence')">证据管理</button><button class="btn" onclick="adminTabOpen('tracking')">快递监控</button><button class="btn" onclick="adminTabOpen('admins')">管理员</button><button class="btn" onclick="adminTabOpen('logs')">操作日志</button><button class="btn" onclick="adminTabOpen('settings')">系统设置</button></div><div id="adminBody"><div class="notice">正在加载…</div></div>`;
 $('modal').classList.remove('hidden');await adminTabOpen('overview');
}
async function adminTabOpen(tab){
 adminTab=tab;document.querySelectorAll('#adminNav .btn').forEach((b,i)=>b.classList.toggle('active',['overview','users','tasks','evidence','tracking','admins','logs','settings'][i]===tab));
 const body=$('adminBody');body.innerHTML='<div class="notice">正在读取数据…</div>';
 try{
  if(tab==='overview')return await adminOverview();
  if(tab==='users')return await adminUsers();
  if(tab==='tasks')return await adminTasks();
  if(tab==='evidence')return await adminEvidence();
  if(tab==='tracking')return await adminTracking();
  if(tab==='admins')return await adminAdmins();
  if(tab==='logs')return await adminLogs();
  if(tab==='settings')return adminSettings();
 }catch(e){body.innerHTML=`<div class="notice warn">读取失败：${esc(e.message||e)}</div>`}
}
async function adminOverview(){
 const [u,t,e,r]=await Promise.all([sb.rpc('admin_list_all_users'),sb.rpc('admin_list_all_tasks'),sb.rpc('admin_list_all_evidence'),sb.rpc('admin_list_tracking')]);
 for(const x of [u,t,e,r])if(x.error)throw x.error;
 const users=u.data||[],tasks=t.data||[],ev=e.data||[],tr=r.data||[];
 $('adminBody').innerHTML=`<div class="stats"><div class="stat"><div class="n">${users.length}</div><div class="l">注册用户</div></div><div class="stat"><div class="n">${tasks.length}</div><div class="l">全部售后</div></div><div class="stat"><div class="n">${tasks.filter(x=>x.risk==='高风险').length}</div><div class="l">高风险</div></div><div class="stat"><div class="n">${tr.filter(x=>x.monitoring).length}</div><div class="l">盯单中</div></div><div class="stat"><div class="n">${ev.length}</div><div class="l">证据文件</div></div><div class="stat"><div class="n">${tasks.filter(x=>x.status==='已完成').length}</div><div class="l">已完成</div></div></div><div class="section"><h3>系统运行概况</h3><div class="notice">管理员控制台已连接云端数据库。这里的数据来自全部用户，而不是当前账号。</div></div>`;
}
async function adminUsers(){
 const {data,error}=await sb.rpc('admin_list_all_users');if(error)throw error;const users=data||[];
 const rows=users.map(u=>`<tr><td><b>${esc(u.email||'—')}</b><div class="muted">${esc(u.id)}</div></td><td>${fmt(u.created_at)}</td><td>${fmt(u.last_sign_in_at)}</td><td>${Number(u.task_count||0)}</td><td>${u.is_admin?'<span class="adminPill">管理员</span>':'普通用户'}</td></tr>`).join('');
 $('adminBody').innerHTML=`<div class="section"><h3>全部用户</h3><input id="adminUserSearch" class="input" placeholder="搜索邮箱 / 用户ID" oninput="filterAdminTable('adminUserTable',this.value)"><div style="overflow:auto;margin-top:10px"><table class="adminTable" id="adminUserTable"><thead><tr><th>用户</th><th>注册时间</th><th>最后登录</th><th>售后数</th><th>权限</th></tr></thead><tbody>${rows||'<tr><td colspan="5">暂无用户</td></tr>'}</tbody></table></div></div>`;
}
async function adminTasks(){const {data,error}=await sb.rpc('admin_list_all_tasks');if(error)throw error;const rows=(data||[]).map(t=>`<tr><td>${esc(t.order_id||'—')}</td><td>${esc(t.email||'—')}</td><td>${esc(t.status||'—')}</td><td>${esc(t.risk||'—')}</td><td>${esc(t.tracking_no||'—')}</td><td>${fmt(t.created_at)}</td></tr>`).join('');$('adminBody').innerHTML=`<div class="section"><h3>全站售后任务</h3><div style="overflow:auto"><table class="adminTable"><thead><tr><th>订单</th><th>用户</th><th>状态</th><th>风险</th><th>快递单号</th><th>创建时间</th></tr></thead><tbody>${rows||'<tr><td colspan="6">暂无售后</td></tr>'}</tbody></table></div></div>`}
async function adminEvidence(){const {data,error}=await sb.rpc('admin_list_all_evidence');if(error)throw error;const rows=(data||[]).map(e=>`<tr><td>${esc(e.file_name||'—')}</td><td>${esc(e.email||'—')}</td><td>${esc(e.mime_type||'—')}</td><td>${e.size_bytes?Math.round(e.size_bytes/1024)+' KB':'—'}</td><td>${fmt(e.created_at)}</td></tr>`).join('');$('adminBody').innerHTML=`<div class="section"><h3>全站证据文件</h3><div style="overflow:auto"><table class="adminTable"><thead><tr><th>文件</th><th>用户</th><th>类型</th><th>大小</th><th>上传时间</th></tr></thead><tbody>${rows||'<tr><td colspan="5">暂无证据</td></tr>'}</tbody></table></div></div>`}
async function adminTracking(){const {data,error}=await sb.rpc('admin_list_tracking');if(error)throw error;const rows=(data||[]).map(t=>`<tr><td>${esc(t.tracking_no||'—')}</td><td>${esc(t.email||'—')}</td><td>${t.monitoring?'<span class="adminPill">盯单中</span>':'已停止'}</td><td>${esc(t.order_id||'—')}</td><td>${fmt(t.created_at)}</td></tr>`).join('');$('adminBody').innerHTML=`<div class="section"><h3>全站快递监控</h3><div style="overflow:auto"><table class="adminTable"><thead><tr><th>快递单号</th><th>用户</th><th>状态</th><th>订单</th><th>记录时间</th></tr></thead><tbody>${rows||'<tr><td colspan="5">暂无记录</td></tr>'}</tbody></table></div></div>`}
async function adminAdmins(){const {data,error}=await sb.rpc('admin_list_users');if(error)throw error;const rows=(data||[]).map(u=>`<tr><td><b>${esc(u.email||'—')}</b><div class="muted">${esc(u.id)}</div></td><td>${fmt(u.created_at)}</td><td>${fmt(u.last_sign_in_at)}</td><td>${Number(u.task_count||0)}</td><td>${u.id===session.user.id?'<span class="muted">当前账号</span>':`<button class="btn danger" onclick="adminRemoveUser('${u.id}','${esc(u.email||'该用户')}')">移除</button>`}</td></tr>`).join('');$('adminBody').innerHTML=`<div class="section"><h3>添加管理员</h3><div class="grid2"><input id="adminEmail" class="input" type="email" placeholder="输入已注册用户邮箱"><button class="btn primary" onclick="adminAddUser()">添加管理员</button></div></div><div class="section"><h3>管理员列表</h3><div style="overflow:auto"><table class="adminTable"><thead><tr><th>邮箱</th><th>注册时间</th><th>最后登录</th><th>售后数</th><th>操作</th></tr></thead><tbody>${rows||'<tr><td colspan="5">暂无管理员</td></tr>'}</tbody></table></div></div>`}
async function adminAddUser(){const email=($('adminEmail')?.value||'').trim().toLowerCase();if(!email)return toast('请输入用户注册邮箱','err');const {data,error}=await sb.rpc('admin_add_user_by_email',{p_email:email});if(error)return toast(error.message||'添加失败','err');if(!data?.ok)return toast(data?.message||'添加失败','err');toast('管理员添加成功','ok');await adminAdmins()}
async function adminRemoveUser(id,email){if(id===session.user.id)return toast('不能移除当前登录管理员','err');if(!confirm('确定移除 '+email+' 的管理员权限？'))return;const {data,error}=await sb.rpc('admin_remove_user',{p_user_id:id});if(error)return toast(error.message||'移除失败','err');if(!data?.ok)return toast(data?.message||'移除失败','err');toast('管理员权限已移除','ok');await adminAdmins()}
async function adminLogs(){const {data,error}=await sb.rpc('admin_list_logs');if(error)throw error;const rows=(data||[]).map(x=>`<tr><td>${fmt(x.created_at)}</td><td>${esc(x.email||'—')}</td><td>${esc(x.action||'—')}</td><td>${esc(x.detail||'—')}</td></tr>`).join('');$('adminBody').innerHTML=`<div class="section"><h3>操作日志</h3><div style="overflow:auto"><table class="adminTable"><thead><tr><th>时间</th><th>用户</th><th>操作</th><th>详情</th></tr></thead><tbody>${rows||'<tr><td colspan="4">暂无日志</td></tr>'}</tbody></table></div></div>`}
function adminSettings(){$('adminBody').innerHTML=`<div class="section"><h3>系统设置</h3><div class="notice">当前版本：售后雷达 Pro 5.0 Admin Console</div><div class="grid2" style="margin-top:10px"><div><label class="muted">默认举证时限</label><input class="input" value="3小时" disabled></div><div><label class="muted">云端同步</label><input class="input" value="Supabase · 已启用" disabled></div></div></div><div class="section"><h3>安全说明</h3><div class="muted">管理员操作通过数据库 RPC 校验管理员身份。前端隐藏按钮不等于权限控制，真正权限由数据库执行。</div></div>`}
function filterAdminTable(id,q){const x=q.toLowerCase();document.querySelectorAll('#'+id+' tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(x)?'':'none')}
init();
</script>
