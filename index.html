<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<title>售后雷达 Pro 5.0 · 云端版</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#f4f6fa;color:#172033;font-family:system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.top{position:sticky;top:0;z-index:20;background:#111827;color:#fff;padding:14px max(14px,env(safe-area-inset-left)) 12px}.toprow{display:flex;justify-content:space-between;gap:10px;align-items:center}.brand{font-size:20px;font-weight:850}.muted{color:#738096;font-size:12px}.top .muted{color:#aab3c2}.wrap{max-width:1080px;margin:auto;padding:12px 14px 40px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.card,.panel{background:#fff;border-radius:16px;box-shadow:0 2px 14px #1118270c}.card{padding:13px}.num{font-size:23px;font-weight:850}.label{font-size:12px;color:#748096;margin-top:2px}.toolbar{display:grid;grid-template-columns:1fr 150px 120px;gap:8px;margin:12px 0}.input,select,textarea{width:100%;border:1px solid #d9dee8;background:#fff;border-radius:11px;padding:10px 11px;outline:0}.input:focus,select:focus,textarea:focus{border-color:#64748b}.panel{padding:14px;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{background:#eef2f7;color:#172033;padding:10px 13px;border-radius:11px;font-weight:700}.btn.primary{background:#111827;color:#fff}.btn.good{background:#e7f7ee;color:#176b3a}.btn.warn{background:#fff2d8;color:#8a5b00}.btn.danger{background:#fee8e8;color:#a21c1c}.btn:disabled{opacity:.5;cursor:not-allowed}.list{display:grid;gap:9px}.item{background:#fff;border-radius:15px;padding:13px;border:1px solid #e7eaf0}.itemhead{display:flex;justify-content:space-between;gap:10px}.title{font-weight:800}.tag{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;background:#eef2f7;margin:3px 3px 0 0}.tag.red{background:#fee8e8;color:#a21c1c}.tag.green{background:#e8f7ef;color:#176b3a}.tag.orange{background:#fff1d6;color:#8a5b00}.small{font-size:12px}.detail{display:none}.detail.open{display:block}.section-title{font-weight:850;margin-bottom:9px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.field{margin-bottom:9px}.field label{display:block;font-size:12px;color:#68758a;margin-bottom:5px}.files{display:grid;gap:8px}.file{border:1px solid #e4e8ef;border-radius:12px;padding:9px;background:#fafbfd}.fileline{display:flex;justify-content:space-between;gap:8px;align-items:center}.preview{max-width:100%;max-height:240px;border-radius:10px;margin-top:8px}.drop{border:1px dashed #aeb8c7;border-radius:13px;padding:15px;text-align:center;background:#fafbfd}.timeline{border-left:2px solid #e1e6ef;padding-left:12px;margin-left:5px}.event{position:relative;margin:0 0 13px}.event:before{content:"";position:absolute;left:-19px;top:4px;width:8px;height:8px;border-radius:50%;background:#64748b}.hidden{display:none!important}.login{max-width:430px;margin:9vh auto;padding:20px}.error{color:#b42318;background:#fff0f0;border-radius:10px;padding:9px;font-size:12px}.ok{color:#176b3a;background:#eaf8f0;border-radius:10px;padding:9px;font-size:12px}.countdown{font-variant-numeric:tabular-nums;font-weight:850}.dangertext{color:#b42318}.authbar{display:flex;align-items:center;gap:7px}.avatar{width:32px;height:32px;border-radius:50%;background:#374151;display:grid;place-items:center;font-size:12px;font-weight:800}
@media(max-width:720px){.grid4{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr 1fr}.toolbar .wide{grid-column:1/-1}.twocol,.three{grid-template-columns:1fr}.itemhead{display:block}.authbar .email{display:none}}
</style>
</head>
<body>
<header class="top">
  <div class="toprow">
    <div><div class="brand">售后雷达 Pro 5.0</div><div class="muted">云端同步 · Android / iPhone</div></div>
    <div id="authBar" class="authbar hidden"><span class="email"></span><span class="avatar">U</span><button class="btn" onclick="signOut()">退出</button></div>
  </div>
</header>

<section id="loginView" class="login panel">
  <div class="section-title">登录云端账号</div>
  <div class="muted" style="margin-bottom:12px">同一个账号登录不同手机，售后资料和举证附件都会从云端重新加载。</div>
  <div class="field"><label>邮箱</label><input id="email" class="input" type="email" autocomplete="email" placeholder="your@email.com"></div>
  <div class="field"><label>密码</label><input id="password" class="input" type="password" autocomplete="current-password" placeholder="至少 6 位"></div>
  <div id="authMsg" class="hidden"></div>
  <div class="row"><button class="btn primary" onclick="login()">登录</button><button class="btn" onclick="register()">注册账号</button></div>
</section>

<main id="app" class="wrap hidden">
  <div class="grid4">
    <div class="card"><div class="num" id="cAll">0</div><div class="label">全部售后</div></div>
    <div class="card"><div class="num" id="cPending">0</div><div class="label">待处理</div></div>
    <div class="card"><div class="num" id="cEvidence">0</div><div class="label">待举证</div></div>
    <div class="card"><div class="num" id="cRisk">0</div><div class="label">高风险</div></div>
  </div>

  <div class="panel">
    <div class="row" style="justify-content:space-between"><div class="section-title">售后工作台</div><button class="btn primary" onclick="newTask()">＋ 新建售后</button></div>
    <div class="toolbar">
      <input id="search" class="input wide" placeholder="搜索订单号 / 买家 / 快递单号 / 原因" oninput="render()">
      <select id="filter" onchange="render()"><option value="">全部状态</option><option>待处理</option><option>协商中</option><option>买家拒绝协商</option><option>待举证</option><option>仲裁中</option><option>已完成</option></select>
      <select id="riskFilter" onchange="render()"><option value="">全部风险</option><option>普通</option><option>高风险</option></select>
    </div>
    <div id="list" class="list"></div>
  </div>

  <div id="detail" class="panel hidden"></div>
</main>

<script>
const CONFIG = {
  SUPABASE_URL: "https://bdnazzywqqmliqyhhtig.supabase.co",
  SUPABASE_KEY: "sb_publishable_AUD55Xac5eZXmNtcblkgcQ_Y4D-MYk9"
};
const ready = CONFIG.SUPABASE_URL.startsWith("http") && !CONFIG.SUPABASE_KEY.includes("YOUR_");
let sb=null, session=null, tasks=[], current=null, timer=null;

function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmtDate(v){if(!v)return "-";return new Date(v).toLocaleString("zh-CN",{hour12:false})}
function msg(text,good=false){const e=document.getElementById("authMsg");e.className=good?"ok":"error";e.textContent=text}
function cfgCheck(){if(!ready){document.getElementById("authMsg").className="error";document.getElementById("authMsg").textContent="请先在 index.html 顶部填写 Supabase URL 和 Publishable key。";return false}return true}

async function init(){
 if(!cfgCheck())return;
 sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_KEY);
 const r=await sb.auth.getSession(); session=r.data.session;
 if(session) showApp(); else showLogin();
 sb.auth.onAuthStateChange((_e,s)=>{session=s;s?showApp():showLogin()});
}
function showLogin(){document.getElementById("loginView").classList.remove("hidden");document.getElementById("app").classList.add("hidden");document.getElementById("authBar").classList.add("hidden")}
function showApp(){document.getElementById("loginView").classList.add("hidden");document.getElementById("app").classList.remove("hidden");document.getElementById("authBar").classList.remove("hidden");document.querySelector(".email").textContent=session.user.email||"";loadAll()}
async function login(){if(!cfgCheck())return;const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)msg(error.message);else msg("登录成功",true)}
async function register(){if(!cfgCheck())return;const em=email.value.trim(),pw=password.value;if(pw.length<6)return msg("密码至少 6 位");const {error}=await sb.auth.signUp({email:em,password:pw});if(error)msg(error.message);else msg("注册成功。如果项目开启邮箱验证，请先完成邮箱验证。",true)}
async function signOut(){await sb.auth.signOut()}

async function loadAll(){
 const {data,error}=await sb.from("after_sales_tasks").select("*").order("created_at",{ascending:false});
 if(error){alert(error.message);return} tasks=data||[];render();document.getElementById("detail").classList.add("hidden");startTimers()
}
function render(){
 const q=document.getElementById("search").value.trim().toLowerCase(), f=document.getElementById("filter").value, rf=document.getElementById("riskFilter").value;
 let a=tasks.filter(t=>{const s=[t.order_id,t.buyer_name,t.tracking_no,t.reason,t.evidence_reason].join(" ").toLowerCase();return(!q||s.includes(q))&&(!f||t.status===f)&&(!rf||t.risk===rf)});
 cAll.textContent=tasks.length;cPending.textContent=tasks.filter(t=>["待处理","协商中"].includes(t.status)).length;cEvidence.textContent=tasks.filter(t=>t.status==="待举证").length;cRisk.textContent=tasks.filter(t=>t.risk==="高风险").length;
 list.innerHTML=a.length?a.map(card).join(""):`<div class="muted" style="padding:20px;text-align:center">暂无匹配售后</div>`;
}
function card(t){
 const left=t.deadline?deadlineText(t.deadline):"未设置截止时间";
 return `<div class="item"><div class="itemhead"><div><div class="title">${esc(t.order_id||"未填写订单号")}</div><div class="small">${esc(t.buyer_name||"未填写买家")} · ${esc(t.tracking_no||"无快递单号")}</div></div><div><span class="tag ${t.risk==="高风险"?"red":""}">${esc(t.risk)}</span><span class="tag">${esc(t.status)}</span></div></div>
 <div class="small" style="margin:9px 0;color:#68758a">举证截止：<span class="countdown" data-deadline="${esc(t.deadline||"")}">${left}</span></div>
 <div class="row"><button class="btn primary" onclick="openTask('${t.id}')">打开</button><button class="btn" onclick="rejectNegotiation('${t.id}')">买家拒绝协商</button><button class="btn warn" onclick="toggleTracking('${t.id}')">${t.tracking_no?(t.monitoring?"停止盯单":"开始盯单"):"输入快递号"}</button></div></div>`
}
function deadlineText(d){const ms=new Date(d).getTime()-Date.now();if(ms<=0)return "已到期";let s=Math.floor(ms/1000),h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60);s%=60;return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`}
function startTimers(){clearInterval(timer);timer=setInterval(()=>{document.querySelectorAll("[data-deadline]").forEach(e=>e.textContent=deadlineText(e.dataset.deadline));checkExpired()},1000)}
let checking=false;
async function checkExpired(){if(checking||!session)return;checking=true;try{for(const t of tasks){if(t.deadline&&new Date(t.deadline)<=new Date()&&t.submission_status==="pending"&&t.status==="待举证"){await processExpired(t)}}}finally{checking=false}}
async function processExpired(t){
 const {data:files}=await sb.from("evidence_files").select("id").eq("task_id",t.id);
 if(files&&files.length){await sb.from("after_sales_tasks").update({submission_status:"submitted_auto_local",status:"已完成",updated_at:new Date().toISOString()}).eq("id",t.id);await loadAll()}
 else {await sb.from("after_sales_tasks").update({submission_status:"failed_no_evidence",updated_at:new Date().toISOString()}).eq("id",t.id);await loadAll()}
}
async function newTask(){
 if(!session)return;
 const deadline=new Date(Date.now()+3*3600*1000).toISOString();
 const {data,error}=await sb.from("after_sales_tasks").insert({user_id:session.user.id,order_id:"",buyer_name:"",tracking_no:"",after_sales_type:"退款/售后",reason:"",status:"待处理",risk:"普通",evidence_reason:"",deadline,submission_status:"pending"}).select().single();
 if(error)return alert(error.message);tasks.unshift(data);render();openTask(data.id)
}
async function rejectNegotiation(id){
 const {error}=await sb.from("after_sales_tasks").update({status:"待举证",risk:"高风险",deadline:new Date(Date.now()+3*3600*1000).toISOString(),submission_status:"pending",updated_at:new Date().toISOString()}).eq("id",id);
 if(error)return alert(error.message);await loadAll();openTask(id)
}
async function openTask(id){
 const t=tasks.find(x=>x.id===id);if(!t)return;current=t;
 const {data:files}=await sb.from("evidence_files").select("*").eq("task_id",id).order("created_at",{ascending:true});
 const d=document.getElementById("detail");d.classList.remove("hidden");
 d.innerHTML=`<div class="row" style="justify-content:space-between"><div class="section-title">售后详情</div><button class="btn" onclick="closeDetail()">关闭</button></div>
 <div class="twocol">
 <div class="field"><label>订单号</label><input id="f_order" class="input" value="${esc(t.order_id)}"></div>
 <div class="field"><label>买家</label><input id="f_buyer" class="input" value="${esc(t.buyer_name)}"></div>
 <div class="field"><label>快递单号</label><input id="f_track" class="input" value="${esc(t.tracking_no)}"></div>
 <div class="field"><label>售后类型</label><input id="f_type" class="input" value="${esc(t.after_sales_type)}"></div>
 </div>
 <div class="three"><div class="field"><label>状态</label><select id="f_status">${["待处理","协商中","买家拒绝协商","待举证","仲裁中","已完成"].map(x=>`<option ${x===t.status?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label>风险</label><select id="f_risk"><option ${t.risk==="普通"?"selected":""}>普通</option><option ${t.risk==="高风险"?"selected":""}>高风险</option></select></div><div class="field"><label>举证截止</label><input id="f_deadline" class="input" type="datetime-local" value="${toLocal(t.deadline)}"></div></div>
 <div class="field"><label>售后原因</label><textarea id="f_reason" rows="3">${esc(t.reason)}</textarea></div>
 <div class="field"><label>举证理由（自动保存到云端）</label><textarea id="f_evidence" rows="5" placeholder="填写你准备提交的举证理由">${esc(t.evidence_reason)}</textarea></div>
 <div class="row"><button class="btn primary" onclick="saveTask()">保存全部信息</button><button class="btn good" onclick="submitLocal()">提交当前举证</button><button class="btn danger" onclick="deleteTask()">删除售后</button></div>
 <hr style="border:0;border-top:1px solid #edf0f4;margin:16px 0">
 <div class="section-title">举证材料</div>
 <div class="drop"><div style="font-weight:800;margin-bottom:7px">选择图片 / 视频 / 文件</div><div class="muted">推荐视频使用 MP4（H.264/AAC）。材料会直接上传到云端，不依赖本机保存。</div><div class="row" style="justify-content:center;margin-top:10px"><input id="videoInput" class="hidden" type="file" accept="video/*" multiple onchange="uploadFiles(this.files)"><input id="imageInput" class="hidden" type="file" accept="image/*" multiple onchange="uploadFiles(this.files)"><input id="fileInput" class="hidden" type="file" accept=".pdf,.doc,.docx,.txt,application/pdf" multiple onchange="uploadFiles(this.files)"><button class="btn" onclick="videoInput.click()">选择视频</button><button class="btn" onclick="imageInput.click()">选择图片</button><button class="btn" onclick="fileInput.click()">选择文件</button></div></div>
 <div id="files" class="files" style="margin-top:10px">${(files||[]).map(fileCard).join("")||'<div class="muted">还没有举证材料</div>'}</div>
 <hr style="border:0;border-top:1px solid #edf0f4;margin:16px 0">
 <div class="section-title">操作记录</div><div class="timeline"><div class="event small">创建：${fmtDate(t.created_at)}</div><div class="event small">当前状态：${esc(t.status)}</div><div class="event small">提交状态：${esc(t.submission_status)}</div></div>`;
 d.scrollIntoView({behavior:"smooth",block:"start"});
}
function toLocal(v){if(!v)return "";const d=new Date(v);const p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}
function closeDetail(){document.getElementById("detail").classList.add("hidden");current=null}
function fileCard(f){return `<div class="file"><div class="fileline"><div><b>${esc(f.file_name)}</b><div class="muted">${esc(f.mime_type)} · ${Math.round((f.size_bytes||0)/1024/1024*10)/10} MB</div></div><button class="btn danger" onclick="removeFile('${f.id}','${esc(f.storage_path)}')">删除</button></div><button class="btn" style="margin-top:7px" onclick="viewFile('${esc(f.storage_path)}','${esc(f.mime_type)}')">查看/打开</button></div>`}
async function viewFile(path,mime){const {data,error}=await sb.storage.from("after-sales-evidence").createSignedUrl(path,3600);if(error)return alert(error.message);window.open(data.signedUrl,"_blank")}
async function uploadFiles(fileList){
 if(!current||!fileList?.length)return;
 for(const file of [...fileList]){
   if(file.size>500*1024*1024){alert(`${file.name} 超过 500MB，未上传`);continue}
   const safe=file.name.replace(/[^\w.\-\u4e00-\u9fa5]/g,"_");
   const path=`${session.user.id}/${current.id}/${crypto.randomUUID()}-${safe}`;
   const up=await sb.storage.from("after-sales-evidence").upload(path,file,{upsert:false,contentType:file.type||"application/octet-stream"});
   if(up.error){alert(`上传失败：${file.name}\n${up.error.message}`);continue}
   const ins=await sb.from("evidence_files").insert({user_id:session.user.id,task_id:current.id,file_name:file.name,mime_type:file.type||"",size_bytes:file.size,storage_path:path});
   if(ins.error){await sb.storage.from("after-sales-evidence").remove([path]);alert(ins.error.message)}
 }
 await openTask(current.id);await loadAll()
}
async function removeFile(id,path){if(!confirm("确定删除这个举证材料？"))return;await sb.storage.from("after-sales-evidence").remove([path]);const {error}=await sb.from("evidence_files").delete().eq("id",id);if(error)return alert(error.message);openTask(current.id)}
async function saveTask(){
 const patch={order_id:f_order.value.trim(),buyer_name:f_buyer.value.trim(),tracking_no:f_track.value.trim(),after_sales_type:f_type.value.trim(),status:f_status.value,risk:f_risk.value,evidence_reason:f_evidence.value,reason:f_reason.value,deadline:f_deadline.value?new Date(f_deadline.value).toISOString():null,updated_at:new Date().toISOString()};
 const {error}=await sb.from("after_sales_tasks").update(patch).eq("id",current.id);if(error)return alert(error.message);Object.assign(current,patch);const i=tasks.findIndex(x=>x.id===current.id);if(i>=0)tasks[i]={...tasks[i],...patch};render();alert("已保存到云端")}
async function submitLocal(){
 const {data:files}=await sb.from("evidence_files").select("id").eq("task_id",current.id);if(!files?.length)return alert("请先上传至少一份举证材料");
 await sb.from("after_sales_tasks").update({submission_status:"submitted_manual",status:"已完成",updated_at:new Date().toISOString()}).eq("id",current.id);
 await loadAll();openTask(current.id);alert("已记录为本系统“已提交”。尚未连接抖店官方 API。")
}
async function deleteTask(){if(!confirm("删除后该售后及其云端举证材料都会删除，确定？"))return;const {data:fs}=await sb.from("evidence_files").select("storage_path").eq("task_id",current.id);if(fs?.length)await sb.storage.from("after-sales-evidence").remove(fs.map(x=>x.storage_path));const {error}=await sb.from("after_sales_tasks").delete().eq("id",current.id);if(error)return alert(error.message);closeDetail();loadAll()}
async function toggleTracking(id){
 const t=tasks.find(x=>x.id===id);if(!t.tracking_no){const n=prompt("输入快递单号",t.tracking_no||"");if(!n)return;const {error}=await sb.from("after_sales_tasks").update({tracking_no:n,updated_at:new Date().toISOString()}).eq("id",id);if(error)return alert(error.message);await sb.from("tracking_records").insert({user_id:session.user.id,task_id:id,tracking_no:n,monitoring:true});await loadAll();return}
 const {data,error}=await sb.from("tracking_records").select("*").eq("task_id",id).order("created_at",{ascending:false}).limit(1).maybeSingle();if(error)return alert(error.message);if(!data)return;
 await sb.from("tracking_records").update({monitoring:!data.monitoring,updated_at:new Date().toISOString()}).eq("id",data.id);await loadAll()
}
init();
</script>
</body>
</html>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(console.error);
  });
}
</script>
