<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07111f">
<title>售后雷达 Pro</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#07111f;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC",sans-serif}
.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:84px}
header{padding:22px 18px 12px;position:sticky;top:0;background:rgba(7,17,31,.94);backdrop-filter:blur(14px);z-index:5}
h1{font-size:24px;margin:0 0 5px}.sub{font-size:12px;color:#8195ab}
.page{display:none;padding:8px 14px}.page.active{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#111e31;border:1px solid #1c3048;border-radius:18px;padding:16px;margin:10px 0}
.metric{min-height:122px}.label{font-size:13px;color:#91a5bb}.num{font-size:36px;font-weight:800;margin:12px 0 5px}.hint{font-size:12px;color:#71869d}
.green{color:#63d9a3}.red{color:#ff6b6b}.yellow{color:#ffc857}.blue{color:#7ca9ff}
.status{display:flex;align-items:center;gap:8px;font-weight:700}.dot{width:9px;height:9px;border-radius:50%;background:#63d9a3;display:inline-block}
button{border:0;border-radius:13px;padding:13px 16px;background:#326cff;color:white;font-weight:700;font-size:14px;width:100%;margin-top:8px}
button.secondary{background:#172940;color:#b9c9da}
.alert{padding:14px 0;border-bottom:1px solid #20334a}.alert:last-child{border:0}.row{display:flex;justify-content:space-between;gap:10px}.small{font-size:12px;color:#7e93aa;margin-top:6px}
.badge{font-size:11px;padding:4px 7px;border-radius:7px;background:#35232a;color:#ff8c8c;height:max-content}
.item{background:#111e31;border:1px solid #1c3048;border-radius:15px;padding:14px;margin:9px 0}
.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(9,21,36,.97);border-top:1px solid #1c3048;display:flex;justify-content:center;z-index:10}
.nav{max-width:760px;width:100%;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{background:transparent;color:#71869d;border-radius:0;margin:0;padding:13px 3px 15px;font-size:12px}
.nav button.on{color:#fff}.nav span{display:block;font-size:19px;margin-bottom:3px}
.section-title{font-size:16px;font-weight:800;margin:18px 2px 8px}
.search{width:100%;border:1px solid #243950;background:#0d1a2c;color:#fff;padding:13px;border-radius:13px;outline:none}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #20334a}
.switch{width:46px;height:26px;border-radius:20px;background:#326cff;padding:3px}.switch i{display:block;background:#fff;width:20px;height:20px;border-radius:50%;margin-left:20px}
@media(min-width:700px){header,.page{padding-left:22px;padding-right:22px}}
</style>
</head>
<body>
<div class="app">
<header>
<h1>售后雷达 Pro</h1>
<div class="sub">手机 Web 版 · 模拟测试模式</div>
</header>

<section id="home" class="page active">
<div class="card">
<div class="status"><i class="dot"></i> 雷达正常运行</div>
<div class="small">数据源：本地模拟 · 最后检查：<span id="last">刚刚</span></div>
<button onclick="newEvent()">立即检查</button>
</div>
<div class="grid">
<div class="card metric"><div class="label">买家拒绝协商</div><div class="num red" id="ref">12</div><div class="hint">待关注</div></div>
<div class="card metric"><div class="label">仲裁</div><div class="num yellow" id="arb">4</div><div class="hint">高优先级</div></div>
<div class="card metric"><div class="label">高风险</div><div class="num red" id="risk">7</div><div class="hint">需要处理</div></div>
<div class="card metric"><div class="label">今日新增</div><div class="num blue" id="today">6</div><div class="hint">过去 24 小时</div></div>
</div>
<div class="section-title">最近预警</div>
<div class="card" id="homeAlerts"></div>
</section>

<section id="orders" class="page">
<div class="section-title">售后列表</div>
<input class="search" id="search" placeholder="搜索订单号 / 售后类型" oninput="renderOrders()">
<div id="orderList"></div>
</section>

<section id="alerts" class="page">
<div class="section-title">预警中心</div>
<div class="card" id="alertList"></div>
</section>

<section id="settings" class="page">
<div class="section-title">系统设置</div>
<div class="card">
<div class="toggle"><span>自动刷新</span><div class="switch"><i></i></div></div>
<div class="toggle"><span>新增事件提醒</span><div class="switch"><i></i></div></div>
<div class="toggle"><span>高风险优先</span><div class="switch"><i></i></div></div>
</div>
<div class="card">
<div class="label">当前数据源</div><div style="font-weight:800;margin-top:8px">模拟测试数据</div>
<div class="small">未来获得抖店官方 API 权限后，可替换为官方数据源。</div>
</div>
<button onclick="resetData()">恢复初始数据</button>
</section>

<div class="bottom"><div class="nav">
<button class="on" onclick="go('home',this)"><span>⌂</span>首页</button>
<button onclick="go('orders',this)"><span>▤</span>售后</button>
<button onclick="go('alerts',this)"><span>!</span>预警</button>
<button onclick="go('settings',this)"><span>⚙</span>设置</button>
</div></div>
</div>

<script>
const initialOrders=Array.from({length:28},(_,i)=>{
 const types=['买家拒绝协商','仲裁中','售后申请','待处理','已完成'];
 const t=types[i%types.length];
 return {id:'20261005'+String(100000+i),type:t,amount:(29.9+(i*17.3)%380).toFixed(2),time:'今天 '+String(9+i%12).padStart(2,'0')+':'+String(i*7%60).padStart(2,'0'),level:(t==='仲裁中'||t==='买家拒绝协商')?'高':i%3===0?'中':'低'};
});
let orders=[...initialOrders];
let alerts=[
 {title:'买家拒绝协商',order:'20261005003821',time:'刚刚',level:'高'},
 {title:'新增仲裁',order:'20261005003107',time:'8分钟前',level:'高'},
 {title:'售后申请',order:'20261004992812',time:'21分钟前',level:'中'}
];
let stats={ref:12,arb:4,risk:7,today:6};

function go(id,btn){
 document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));btn.classList.add('on');
 if(id==='orders')renderOrders(); if(id==='alerts')renderAlerts();
}
function renderAlerts(){
 const html=alerts.map(a=>`<div class="alert"><div class="row"><b>${a.title}</b><span class="badge">${a.level}</span></div><div class="small">${a.order} · ${a.time}</div></div>`).join('');
 document.getElementById('alertList').innerHTML=html||'<div class="small">暂无预警</div>';
 document.getElementById('homeAlerts').innerHTML=alerts.slice(0,3).map(a=>`<div class="alert"><div class="row"><b>${a.title}</b><span class="badge">${a.level}</span></div><div class="small">${a.order} · ${a.time}</div></div>`).join('');
}
function renderOrders(){
 const q=(document.getElementById('search')?.value||'').toLowerCase();
 const list=orders.filter(o=>(o.id+o.type).toLowerCase().includes(q));
 document.getElementById('orderList').innerHTML=list.map(o=>`<div class="item"><div class="row"><b>${o.type}</b><span class="badge">${o.level}</span></div><div class="small">${o.id} · ¥${o.amount}</div><div class="small">${o.time}</div></div>`).join('');
}
function sync(){
 ref.textContent=stats.ref;arb.textContent=stats.arb;risk.textContent=stats.risk;today.textContent=stats.today;
 last.textContent=new Date().toLocaleTimeString();
 renderAlerts();renderOrders();
}
function newEvent(){
 stats.ref++;stats.risk++;stats.today++;
 const id='20261005'+Math.floor(10000+Math.random()*89999);
 alerts.unshift({title:'模拟新增拒绝协商',order:id,time:'刚刚',level:'高'});
 orders.unshift({id,type:'买家拒绝协商',amount:(49+Math.random()*300).toFixed(2),time:'刚刚',level:'高'});
 sync();
 alert('已发现新的售后事件');
}
function resetData(){stats={ref:12,arb:4,risk:7,today:6};orders=[...initialOrders];alerts=alerts.slice(-3);sync();}
sync();setInterval(()=>{last.textContent=new Date().toLocaleTimeString()},30000);
</script>
</body>
</html>
