<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>售后雷达 Pro 6.1</title>
<link rel="manifest" href="./manifest.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#738096;--line:#e5e9f1;--brand:#4f6fdc;--soft:#eef2ff;--danger:#d94c5a;--ok:#168d5a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}.hidden{display:none!important}.wrap{max-width:1180px;margin:auto;padding:12px 12px 95px}
.top{position:sticky;top:0;z-index:20;background:#ffffffdf;backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:10px 12px}
.topin{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{display:flex;align-items:center;gap:8px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--brand);font-weight:900}.title{font-weight:900}.sub,.muted{font-size:11px;color:var(--muted)}
.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.btn{background:#eef1f6;color:#263247;padding:9px 11px;border-radius:11px;font-weight:800;font-size:12px}
.primary{background:var(--brand);color:#fff}.blue{background:var(--soft);color:var(--brand)}.danger{background:#ffebee;color:#b52f3c}.good{background:#e7f7ef;color:#13764b}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px;box-shadow:0 7px 25px #20304b0b}.grid{display:grid;gap:9px}
.hero{padding:18px;border-radius:22px;background:linear-gradient(135deg,#eef2ff,#f8faff);border:1px solid #dfe6ff}.hero h1{margin:0;font-size:20px}
.stats{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1.25fr .75fr}.tasks{grid-template-columns:repeat(2,1fr)}
.input,select,textarea{width:100%;background:var(--card);border:1px solid #dfe4ed;border-radius:11px;padding:10px;color:var(--text);outline:0}
.toolbar{display:grid;grid-template-columns:minmax(0,1fr) 160px 130px 120px;gap:7px}.pill{display:inline-flex;padding:4px 8px;border-radius:99px;background:#eef1f6;font-size:11px;font-weight:800}.red{background:#ffebee;color:#b52f3c}
.modal{position:fixed;inset:0;z-index:60;background:#17203366;display:grid;place-items:center;padding:10px}.modalbox{background:var(--card);width:min(900px,100%);max-height:90vh;overflow:auto;border-radius:22px;padding:15px}
.drawer{position:fixed;inset:0;z-index:55;background:#17203366;display:flex;justify-content:flex-end}.sheet{width:min(760px,100%);height:100%;overflow:auto;background:var(--card)}
.sheethead{position:sticky;top:0;background:#ffffffed;z-index:2;padding:12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.bottom{position:fixed;z-index:30;left:50%;bottom:9px;transform:translateX(-50%);width:min(650px,calc(100% - 20px));display:grid;grid-template-columns:repeat(5,1fr);padding:6px;background:#fffffff0;border:1px solid var(--line);border-radius:24px;box-shadow:0 15px 38px #1e2d4b22}
.bottom button{background:transparent;color:var(--muted);padding:5px;font-size:10px;font-weight:800}.notice{padding:10px;border-radius:12px;background:#f3f5f9;color:#607087;font-size:12px}
.file{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:9px;border:1px solid var(--line);border-radius:12px;margin:6px 0}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}th{color:var(--muted)}
.toast{position:fixed;z-index:100;left:50%;bottom:78px;transform:translateX(-50%);background:#1d2637;color:white;border-radius:11px;padding:10px 14px;font-size:12px;max-width:90%;text-align:center}
.adminbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px;font-size:12px}.kv b{color:var(--muted)}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.two,.tasks{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.email{display:none}.kv{grid-template-columns:85px 1fr}}
</style>
</head>
<body>

<div id="login" class="card" style="max-width:430px;margin:8vh auto;padding:24px">
  <div class="brand"><div class="logo">雷</div><div><div class="title">售后雷达 Pro 6.1</div><div class="sub">云端售后 · 证据 · 店铺 · 3小时风险管控</div></div></div>
  <h2>进入云端工作台</h2>
  <div class="muted">数据保存到 Supabase，可跨设备使用。</div>
  <input id="email" class="input" style="margin-top:14px" placeholder="邮箱">
  <input id="password" class="input" style="margin-top:7px" type="password" placeholder="密码">
  <div id="regwrap" class="hidden"><input id="password2" class="input" style="margin-top:7px" type="password" placeholder="确认密码"></div>
  <div class="notice" style="margin-top:8px">密码至少8位，包含大写、小写、数字和特殊字符。</div>
  <div id="authmsg" class="notice hidden" style="margin-top:8px"></div>
  <div class="actions" style="margin-top:10px"><button class="btn primary" onclick="login()">登录</button><button class="btn" onclick="register()">注册</button><button class="btn blue" onclick="forgot()">找回密码</button></div>
</div>

<div id="app" class="hidden">
<header class="top"><div class="topin">
  <div class="brand"><div class="logo">雷</div><div><div class="title">售后雷达</div><div class="sub">Pro 6.1 · 云端工作台</div></div></div>
  <div class="actions"><span class="muted email" id="userEmail"></span><span class="muted">在线 <b id="online">0</b></span><button class="btn" onclick="more()">更多</button><button id="adminBtn" class="btn blue hidden" onclick="adminPanel()">管理</button><button class="btn" onclick="logout()">退出</button></div>
</div></header>

<main class="wrap">
<section class="grid two">
  <div class="hero"><h1>今天先处理高风险售后</h1><p class="muted">拒绝协商、仲裁、举证、3小时倒计时、快递盯单和云端资料统一管理。</p>
    <div class="actions"><button class="btn primary" onclick="newTask()">＋ 新建售后</button><button class="btn" onclick="quickReject()">记录拒绝协商</button><button class="btn blue" onclick="refresh()">↻ 同步云端</button></div>
  </div>
  <div class="grid" style="grid-template-columns:1fr 1fr">
    <div class="card"><div class="muted">最紧急</div><b id="urgent">—</b></div>
    <div class="card"><div class="muted">今日完成</div><b id="done">0</b></div>
    <div class="card"><div class="muted">盯单中</div><b id="monitoring">0</b></div>
    <div class="card"><div class="muted">云端资料</div><b id="libcount">0</b></div>
  </div>
</section>

<section class="grid stats" style="margin-top:9px">
  <div class="card"><b id="allc">0</b><div class="muted">全部售后</div></div>
  <div class="card"><b id="pendingc">0</b><div class="muted">待处理</div></div>
  <div class="card"><b id="evidencec">0</b><div class="muted">待举证</div></div>
  <div class="card"><b id="riskc" style="color:var(--danger)">0</b><div class="muted">高风险</div></div>
</section>

<section class="card" style="margin-top:9px"><div class="toolbar">
  <input id="search" class="input" placeholder="搜索订单、买家、店铺、快递单号" oninput="render()">
  <select id="storeFilter" onchange="render()"><option value="">全部店铺</option></select>
  <select id="statusFilter" onchange="render()"><option value="">全部状态</option><option>待处理</option><option>协商中</option><option>买家拒绝协商</option><option>待举证</option><option>仲裁中</option><option>已完成</option></select>
  <select id="riskFilter" onchange="render()"><option value="">全部风险</option><option>普通</option><option>高风险</option></select>
</div></section>
<div style="display:flex;justify-content:space-between;margin:12px 2px 6px"><b>售后任务</b><span class="pill" id="taskcount">0 条</span></div>
<section id="tasklist" class="grid tasks"></section>
</main>

<nav class="bottom"><button onclick="dashboard()">⌂<br>首页</button><button onclick="openStore()">▱<br>店铺</button><button onclick="scrollTasks()">◎<br>售后</button><button onclick="openLibrary()">▤<br>资料库</button><button onclick="more()">＋<br>更多</button></nav>
</div>

<div id="modal" class="modal hidden"><div id="modalbox" class="modalbox"></div></div>
<div id="drawer" class="drawer hidden"><div class="sheet"><div class="sheethead"><div><b id="sheettitle">售后详情</b><div id="sheetsub" class="muted"></div></div><button class="btn" onclick="closeDrawer()">关闭</button></div><div id="detail" style="padding:13px"></div></div></div>
<div id="toast" class="toast hidden"></div>

<script>
const sb=supabase.createClient("https://bdnazzywqqmliqyhhtig.supabase.co","sb_publishable_AUD55Xac5eZXmNtcblkgcQ_Y4D-MYk9");
let session,tasks=[],stores=[],library=[],current,presence,timer,isAdmin=false,adminMode=false;
const $=id=>document.getElementById(id);
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=x=>x?new Date(x).toLocaleString("zh-CN",{hour12:false}):"—";
const strong=p=>p.length>=8&&/[A-Z]/.test(p)&&/[a-z]/.test(p)&&/\d/.test(p)&&/[^A-Za-z0-9]/.test(p);

function toast(s){$("toast").textContent=s;$("toast").classList.remove("hidden");clearTimeout(window.__toast);window.__toast=setTimeout(()=>$("toast").classList.add("hidden"),2800)}
function msg(s){$("authmsg").textContent=s;$("authmsg").classList.remove("hidden")}
function closeModal(){$("modal").classList.add("hidden");$("modalbox").innerHTML=""}
function closeDrawer(){$("drawer").classList.add("hidden")}
function dashboard(){scrollTo({top:0,behavior:"smooth"})}
function scrollTasks(){$("tasklist").scrollIntoView({behavior:"smooth"})}

async function login(){let r=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(r.error)msg(r.error.message)}
async function register(){let e=$("email").value.trim(),p=$("password").value,c=$("password2").value;$("regwrap").classList.remove("hidden");if(!strong(p))return msg("密码不符合要求");if(p!==c)return msg("两次密码不一致");let r=await sb.auth.signUp({email:e,password:p});if(r.error)msg(r.error.message);else msg("注册成功，请检查邮箱验证")}
async function forgot(){let e=$("email").value.trim();if(!e)return msg("请输入邮箱");let r=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.href.split("#")[0]});if(r.error)msg(r.error.message);else msg("重置邮件已发送")}
async function logout(){if(presence)try{await presence.untrack()}catch(e){}await sb.auth.signOut();location.reload()}

async function init(){
  let r=await sb.auth.getSession();
  if(r.data.session){session=r.data.session;show()}else $("login").classList.remove("hidden");
  sb.auth.onAuthStateChange((e,s)=>{
    if(e==="PASSWORD_RECOVERY"){session=s;resetPassword()}
    else if(e==="SIGNED_IN"&&s){session=s;show()}
  });
}
function show(){
  $("login").classList.add("hidden");$("app").classList.remove("hidden");$("userEmail").textContent=session.user.email||"";
  checkAdmin();refresh();presenceStart();clearInterval(timer);timer=setInterval(render,1000);
}
async function checkAdmin(){let r=await sb.rpc("is_admin");isAdmin=!r.error&&r.data===true;$("adminBtn").classList.toggle("hidden",!isAdmin)}

async function loadStores(){
  let r=await sb.from("shop_stores").select("*").order("created_at",{ascending:true});
  if(r.error)return toast(r.error.message);
  stores=r.data||[];
  let s=$("storeFilter"),v=s.value;
  s.innerHTML='<option value="">全部店铺</option>'+stores.filter(x=>x.status!=="disabled").map(x=>`<option value="${x.id}">${esc(x.name||x.store_name)}</option>`).join("");
  s.value=v;
}
async function refresh(){
  await loadStores();
  let r=await sb.from("after_sales_tasks").select("*").order("created_at",{ascending:false});
  if(r.error)return toast(r.error.message);
  tasks=r.data||[];
  let l=await sb.from("evidence_library").select("*").order("created_at",{ascending:false});
  if(!l.error)library=l.data||[];
  render();
}
function storeName(id){let s=stores.find(x=>x.id===id);return s?(s.name||s.store_name||"未命名店铺"):"未关联店铺"}
function remain(t){
  if(t.status==="已完成"||t.submission_status!=="pending")return"已完成 · 倒计时停止";
  let d=new Date(t.deadline||t.deadline_at)-Date.now();
  if(Number.isNaN(d))return"未设置";
  if(d<=0)return"已到期";
  let s=Math.floor(d/1000),h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60),q=s%60;
  return`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(q).padStart(2,"0")}`;
}
function render(){
  let q=($("search")?.value||"").toLowerCase(),sf=$("storeFilter")?.value||"",st=$("statusFilter")?.value||"",rf=$("riskFilter")?.value||"";
  let a=tasks.filter(t=>(!q||[t.order_id,t.buyer_name,t.tracking_no,storeName(t.store_id)].join(" ").toLowerCase().includes(q))&&(!sf||t.store_id===sf)&&(!st||t.status===st)&&(!rf||t.risk===rf));
  $("taskcount").textContent=a.length+" 条";$("allc").textContent=tasks.length;$("pendingc").textContent=tasks.filter(t=>["待处理","协商中"].includes(t.status)).length;
  $("evidencec").textContent=tasks.filter(t=>t.status==="待举证").length;$("riskc").textContent=tasks.filter(t=>t.risk==="高风险").length;
  $("monitoring").textContent=tasks.filter(t=>t.monitoring).length;$("libcount").textContent=library.length;
  let td=new Date().toDateString();$("done").textContent=tasks.filter(t=>t.status==="已完成"&&new Date(t.updated_at||t.created_at).toDateString()===td).length;
  let u=tasks.filter(t=>t.submission_status==="pending"&&(t.deadline||t.deadline_at)).sort((a,b)=>new Date(a.deadline||a.deadline_at)-new Date(b.deadline||b.deadline_at))[0];
  $("urgent").textContent=u?remain(u):"—";
  $("tasklist").innerHTML=a.length?a.map(t=>`<article class="card" onclick="openTask('${t.id}')"><div style="display:flex;justify-content:space-between"><b>${esc(t.order_id||"未填写订单")}</b><span class="pill ${t.risk==="高风险"?"red":""}">${esc(t.risk||"普通")}</span></div><div class="muted">${esc(storeName(t.store_id))} · ${esc(t.buyer_name||"未填写买家")}</div><div style="margin-top:8px"><span class="pill">${esc(t.status)}</span> <span class="muted">${esc(t.tracking_no||"无快递单号")}</span></div><div style="margin-top:8px;font-weight:800;font-size:12px">${esc(remain(t))}</div></article>`).join(""):'<div class="card" style="grid-column:1/-1;text-align:center;padding:28px;color:var(--muted)">暂无匹配的售后任务</div>';
}

function resetPassword(){
  $("modalbox").innerHTML='<h3>设置新密码</h3><input id="np" class="input" type="password" placeholder="新密码"><input id="np2" class="input" style="margin-top:7px" type="password" placeholder="确认新密码"><button class="btn primary" style="margin-top:8px" onclick="savePassword()">保存</button>';
  $("modal").classList.remove("hidden");
}
async function savePassword(){let p=$("np").value,c=$("np2").value;if(!strong(p)||p!==c)return toast("密码不符合要求");let r=await sb.auth.updateUser({password:p});if(r.error)return toast(r.error.message);closeModal();toast("密码已更新")}

function newTask(){
  if(!stores.length)return toast("请先添加店铺");
  $("modalbox").innerHTML=`<h3>新建售后</h3><div class="grid" style="grid-template-columns:1fr 1fr">
  <select id="ts">${stores.filter(s=>s.status!=="disabled").map(s=>`<option value="${s.id}">${esc(s.name||s.store_name)}</option>`).join("")}</select>
  <input id="to" class="input" placeholder="订单号"><input id="tb" class="input" placeholder="买家"><input id="tt" class="input" placeholder="快递单号">
  <select id="ty"><option>退款/售后</option><option>退货退款</option><option>仅退款</option><option>换货</option></select>
  <select id="tr"><option>普通</option><option>高风险</option></select></div>
  <div class="muted" style="margin-top:8px">默认3小时。当前为云端本地流程，不冒充抖店官方自动提交。</div>
  <div class="actions" style="margin-top:9px"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="createTask()">创建</button></div>`;
  $("modal").classList.remove("hidden");
}
async function createTask(){
  let d=new Date(Date.now()+10800000).toISOString(),row={user_id:session.user.id,store_id:$("ts").value,order_id:$("to").value.trim(),buyer_name:$("tb").value.trim(),tracking_no:$("tt").value.trim(),after_sales_type:$("ty").value,risk:$("tr").value,status:"待举证",submission_status:"pending",deadline:d,deadline_at:d,monitoring:!!$("tt").value};
  let r=await sb.from("after_sales_tasks").insert(row).select().single();if(r.error)return toast(r.error.message);
  if(row.tracking_no){let tr=await sb.from("tracking_records").insert({user_id:session.user.id,task_id:r.data.id,tracking_no:row.tracking_no,monitoring:true});if(tr.error)toast("售后已创建，但快递盯单记录保存失败")}
  closeModal();await refresh();openTask(r.data.id);
}

function quickReject(){
  if(!stores.length)return toast("请先添加店铺");
  $("modalbox").innerHTML=`<h3>记录拒绝协商</h3><select id="qs">${stores.filter(s=>s.status!=="disabled").map(s=>`<option value="${s.id}">${esc(s.name||s.store_name)}</option>`).join("")}</select>
  <input id="qo" class="input" style="margin-top:7px" placeholder="订单号"><input id="qb" class="input" style="margin-top:7px" placeholder="买家">
  <textarea id="qm" class="input" style="margin-top:7px" rows="3" placeholder="拒绝原因"></textarea>
  <div class="actions" style="margin-top:8px"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="createReject()">保存</button></div>`;
  $("modal").classList.remove("hidden");
}
async function createReject(){
  let d=new Date(Date.now()+10800000).toISOString();
  let r=await sb.from("after_sales_tasks").insert({user_id:session.user.id,store_id:$("qs").value,order_id:$("qo").value.trim(),buyer_name:$("qb").value.trim(),status:"买家拒绝协商",risk:"高风险",evidence_reason:$("qm").value.trim(),submission_status:"pending",deadline:d,deadline_at:d}).select().single();
  if(r.error)return toast(r.error.message);
  let ev=await sb.from("after_sales_events").insert({user_id:session.user.id,task_id:r.data.id,event_type:"buyer_rejected_negotiation",message:$("qm").value.trim()});
  if(ev.error)toast("售后已保存，但时间线写入失败");
  closeModal();await refresh();openTask(r.data.id);
}

async function openTask(id){
  let r=await sb.from("after_sales_tasks").select("*").eq("id",id).single();if(r.error)return toast(r.error.message);
  current=r.data;
  let [ev,fs]=await Promise.all([
    sb.from("after_sales_events").select("*").eq("task_id",id).order("created_at",{ascending:false}),
    sb.from("evidence_files").select("*").eq("task_id",id).order("created_at",{ascending:false})
  ]);
  $("sheettitle").textContent=current.order_id||"售后详情";$("sheetsub").textContent=storeName(current.store_id)+" · "+(current.buyer_name||"");
  let files=fs.data||[];
  $("detail").innerHTML=`
  <div class="grid" style="grid-template-columns:1fr 1fr">
    <div class="card"><div class="muted">状态</div><b>${esc(current.status)}</b></div>
    <div class="card"><div class="muted">倒计时</div><b id="detailRemain">${esc(remain(current))}</b></div>
  </div>
  <div class="card" style="margin-top:9px"><b>售后信息</b><div class="notice" style="margin-top:7px">
    订单：${esc(current.order_id||"—")}<br>买家：${esc(current.buyer_name||"—")}<br>快递：${esc(current.tracking_no||"—")}<br>风险：${esc(current.risk||"普通")}<br>原因：${esc(current.evidence_reason||current.reason||"—")}
  </div></div>

  <div class="card" style="margin-top:9px">
    <b>举证材料</b>
    <div id="evidenceList">
      ${files.map(f=>`<div class="file"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.file_name)}</span><div class="actions"><button class="btn blue" onclick="previewEvidence('${f.id}')">打开</button><button class="btn danger" onclick="removeEvidence('${f.id}')">移除</button></div></div>`).join("")||'<div class="muted" style="margin-top:6px">暂无材料</div>'}
    </div>
    <div class="actions" style="margin-top:8px">
      <button class="btn primary" onclick="chooseLocalEvidence('${id}')">＋ 本地上传</button>
      <button class="btn blue" onclick="openLibrary('${id}')">☁ 从云端资料库调用</button>
    </div>

function chooseLocalEvidence(taskId){
  let input=$("localEvidenceInput");
  if(!input)return toast("文件选择器加载失败");
  input.value="";
  input.click();

async function uploadLocalEvidence(taskId,fileList){
  if(!fileList||!fileList.length)return;
  let files=[...fileList],success=0,failed=0;
  toast("正在上传 "+files.length+" 个文件…");
  for(const file of files){
    const safeName=file.name.replace(/[^\w.\-\u4e00-\u9fa5]/g,"_");
    const path=`${session.user.id}/task-evidence/${taskId}/${crypto.randomUUID()}-${safeName}`;
    const up=await sb.storage.from("after-sales-evidence").upload(path,file,{contentType:file.type||"application/octet-stream",upsert:false});
    if(up.error){failed++;continue}
    const db=await sb.from("evidence_files").insert({user_id:session.user.id,task_id:taskId,file_name:file.name,mime_type:file.type||"application/octet-stream",size_bytes:file.size,storage_path:path}).select().single();
    if(db.error){await sb.storage.from("after-sales-evidence").remove([path]);failed++;continue}
    success++;
  }
  toast(`上传完成：成功 ${success} 个${failed?`，失败 ${failed} 个`:""}`);
  await refresh();
  await openTask(taskId);
}

async function previewEvidence(id){
  let r=await sb.from("evidence_files").select("*").eq("id",id).single();
  if(r.error)return toast(r.error.message);
  if(!r.data.storage_path)return toast("没有可用的云端文件路径");
  let u=await sb.storage.from("after-sales-evidence").createSignedUrl(r.data.storage_path,600);
  if(u.error)return toast(u.error.message);
  window.open(u.data.signedUrl,"_blank");
}

async function removeEvidence(id){

  let f=r.data;
  let d=await sb.from("evidence_files").delete().eq("id",id);if(d.error)return toast(d.error.message);
  // Library-associated files are shared originals; do not delete their Storage object.
  if(!f.library_id&&f.storage_path){

  }
  toast("已移除举证材料");
  await refresh();openTask(current.id);
}

async function submitTask(id){
  let f=await sb.from("evidence_files").select("id").eq("task_id",id);
  if(f.error)return toast(f.error.message);
  if(!f.data?.length)return toast("请先上传或调用举证材料");
  let r=await sb.from("after_sales_tasks").update({status:"已完成",submission_status:"submitted_manual",updated_at:new Date().toISOString()}).eq("id",id);
  if(r.error)return toast(r.error.message);

async function markArbitration(id){

  if(r.error)return toast(r.error.message);
  await sb.from("after_sales_events").insert({user_id:session.user.id,task_id:id,event_type:"arbitration",message:"手动记录进入仲裁"});

async function tracking(id){
  let t=tasks.find(x=>x.id===id),n=prompt("输入/修改快递单号",t?.tracking_no||"");
  if(!n)return;
  let on=confirm("确定开启持续盯单？");
  let r=await sb.from("after_sales_tasks").update({tracking_no:n.trim(),monitoring:on,updated_at:new Date().toISOString()}).eq("id",id);
  if(r.error)return toast(r.error.message);
  let old=await sb.from("tracking_records").select("id").eq("task_id",id).maybeSingle();
  let rr;
  if(old.data)rr=await sb.from("tracking_records").update({tracking_no:n.trim(),monitoring:on,updated_at:new Date().toISOString()}).eq("id",old.data.id);
  else rr=await sb.from("tracking_records").insert({user_id:session.user.id,task_id:id,tracking_no:n.trim(),monitoring:on});
  if(rr?.error)toast("售后已更新，但快递记录保存失败");
  await refresh();openTask(id);
}

async function deleteTask(id){
  if(!confirm("确定删除这个售后？删除后售后关联记录会删除，云端资料库原文件不会因为关联删除而删除。"))return;
  let fs=await sb.from("evidence_files").select("id,library_id,storage_path").eq("task_id",id);
  if(fs.data?.length){
    let paths=fs.data.filter(x=>!x.library_id&&x.storage_path).map(x=>x.storage_path);
    if(paths.length)await sb.storage.from("after-sales-evidence").remove(paths);
  }
  let r=await sb.from("after_sales_tasks").delete().eq("id",id);
  if(r.error)return toast(r.error.message);
  closeDrawer();await refresh();toast("售后已删除");
}

async function openLibrary(taskId=null){
  let r=await sb.from("evidence_library").select("*").order("created_at",{ascending:false});
  if(r.error)return toast(r.error.message);
  library=r.data||[];
  let rows=library.map(f=>`<div class="file">
    <div style="min-width:0"><b style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.file_name)}</b>
    <div class="muted">${esc(f.platform||"通用")} · ${f.size_bytes?Math.max(1,Math.round(f.size_bytes/1024))+" KB":"—"} · 使用 ${Number(f.usage_count||0)} 次</div></div>
    <div class="actions"><button class="btn blue" onclick="previewLibrary('${f.id}')">打开</button>${taskId?`<button class="btn primary" onclick="useLibraryFile('${f.id}','${taskId}')">用于当前售后</button>`:""}<button class="btn danger" onclick="deleteLibrary('${f.id}')">删除</button></div>
  </div>`).join("");
  $("modalbox").innerHTML=`<div class="adminbar"><div><b>云端资料库</b><div class="muted">原文件独立保存，可重复调用到多个售后</div></div><button class="btn" onclick="closeModal()">关闭</button></div>
  <div class="actions" style="margin-bottom:10px"><button class="btn primary" onclick="libraryUploadClick()">＋ 上传到资料库</button></div>
  <input id="libraryInput" type="file" multiple accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx,.txt" style="display:none" onchange="uploadLibraryFiles(this.files)">
  ${rows||'<div class="notice">资料库暂无文件</div>'}`;
  $("modal").classList.remove("hidden");
}
function libraryUploadClick(){let i=$("libraryInput");if(!i)return toast("文件选择器加载失败");i.value="";i.click()}
async function uploadLibraryFiles(fileList){
  if(!fileList?.length)return;
  let success=0,failed=0;
  for(const file of [...fileList]){
    let safe=file.name.replace(/[^\w.\-\u4e00-\u9fa5]/g,"_");
    let path=`${session.user.id}/library/${crypto.randomUUID()}-${safe}`;
    let up=await sb.storage.from("after-sales-evidence").upload(path,file,{contentType:file.type||"application/octet-stream",upsert:false});
    if(up.error){failed++;continue}
    let db=await sb.from("evidence_library").insert({user_id:session.user.id,store_id:null,platform:"通用",file_name:file.name,mime_type:file.type||"application/octet-stream",size_bytes:file.size,storage_path:path}).select().single();
    if(db.error){await sb.storage.from("after-sales-evidence").remove([path]);failed++;continue}
    success++;
  }
  toast(`资料库上传完成：成功 ${success} 个${failed?`，失败 ${failed} 个`:""}`);
  openLibrary();
}
async function useLibraryFile(id,taskId){
  let r=await sb.from("evidence_library").select("*").eq("id",id).single();if(r.error)return toast(r.error.message);
  let f=r.data;
  let exists=await sb.from("evidence_files").select("id").eq("task_id",taskId).eq("library_id",id).maybeSingle();
  if(exists.data)return toast("该资料已经加入当前售后");
  let x=await sb.from("evidence_files").insert({user_id:session.user.id,task_id:taskId,library_id:f.id,file_name:f.file_name,mime_type:f.mime_type,size_bytes:f.size_bytes,storage_path:f.storage_path});
  if(x.error)return toast(x.error.message);
  await sb.from("evidence_library").update({usage_count:Number(f.usage_count||0)+1,updated_at:new Date().toISOString()}).eq("id",id);
  closeModal();await refresh();openTask(taskId);toast("资料已加入当前售后");
}
async function previewLibrary(id){
  let r=await sb.from("evidence_library").select("*").eq("id",id).single();if(r.error)return toast(r.error.message);
  let u=await sb.storage.from("after-sales-evidence").createSignedUrl(r.data.storage_path,600);if(u.error)return toast(u.error.message);
  window.open(u.data.signedUrl,"_blank");
}
async function deleteLibrary(id){
  let r=await sb.from("evidence_library").select("*").eq("id",id).single();if(r.error)return toast(r.error.message);
  let used=await sb.from("evidence_files").select("id",{count:"exact",head:true}).eq("library_id",id);
  let n=used.count||0;
  if(n>0)return toast(`该资料已被 ${n} 个售后引用，不能直接删除`);
  if(!confirm("确定删除这个云端资料？"))return;
  let d=await sb.from("evidence_library").delete().eq("id",id);if(d.error)return toast(d.error.message);
  if(r.data.storage_path)await sb.storage.from("after-sales-evidence").remove([r.data.storage_path]);
  openLibrary();
}

/* ---------- Presence ---------- */
function presenceStart(){
  if(!session)return;
  if(presence)sb.removeChannel(presence);
  presence=sb.channel("after-sales-presence",{config:{presence:{key:session.user.id}}});
  presence.on("presence",{event:"sync"},()=>{
    let state=presence.presenceState(),ids=new Set();
    Object.values(state).flat().forEach(x=>{if(x.user_id)ids.add(x.user_id)});
    $("online").textContent=String(ids.size);
  });
  presence.subscribe(async st=>{if(st==="SUBSCRIBED")await presence.track({user_id:session.user.id,online_at:new Date().toISOString()})});
}

init();
</script>
</body>
