<script>
const sb=supabase.createClient("https://bdnazzywqqmliqyhhtig.supabase.co","sb_publishable_AUD55Xac5eZXmNtcblkgcQ_Y4D-MYk9");let session,tasks=[],stores=[],library=[],current,presence,timer,isAdmin=false;const $=id=>document.getElementById(id);const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));const fmt=x=>x?new Date(x).toLocaleString("zh-CN",{hour12:false}):"—";const strong=p=>p.length>=8&&/[A-Z]/.test(p)&&/[a-z]/.test(p)&&/\d/.test(p)&&/[^A-Za-z0-9]/.test(p);function toast(s){$("toast").textContent=s;$("toast").classList.remove("hidden");clearTimeout(window.__toast);window.__toast=setTimeout(()=>$("toast").classList.add("hidden"),2800)}function msg(s){$("authmsg").textContent=s;$("authmsg").classList.remove("hidden")}function closeModal(){$("modal").classList.add("hidden");$("modalbox").innerHTML=""}function closeDrawer(){$("drawer").classList.add("hidden")}function dashboard(){scrollTo({top:0,behavior:"smooth"})}function scrollTasks(){$("tasklist").scrollIntoView({behavior:"smooth"})}
async function login(){let r=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(r.error)msg(r.error.message)}async function register(){let e=$("email").value.trim(),p=$("password").value,c=$("password2").value;$("regwrap").classList.remove("hidden");if(!strong(p))return msg("密码不符合要求");if(p!==c)return msg("两次密码不一致");let r=await sb.auth.signUp({email:e,password:p});if(r.error)msg(r.error.message);else msg("注册成功，请检查邮箱验证")}async function forgot(){let e=$("email").value.trim();if(!e)return msg("请输入邮箱");let r=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.href.split("#")[0]});if(r.error)msg(r.error.message);else msg("重置邮件已发送")}async function logout(){if(presence)try{await presence.untrack()}catch(e){}await sb.auth.signOut();location.reload()}
async function init(){let r=await sb.auth.getSession();if(r.data.session){session=r.data.session;show()}else $("login").classList.remove("hidden");sb.auth.onAuthStateChange((e,s)=>{if(e==="PASSWORD_RECOVERY"){session=s;resetPassword()}else if(e==="SIGNED_IN"&&s){session=s;show()}})}function show(){$("login").classList.add("hidden");$("app").classList.remove("hidden");$("userEmail").textContent=session.user.email||"";checkAdmin();refresh();presenceStart();clearInterval(timer);timer=setInterval(render,1000)}async function checkAdmin(){let r=await sb.rpc("is_admin");isAdmin=!r.error&&r.data===true;$("adminBtn").classList.toggle("hidden",!isAdmin)}
async function loadStores(){let r=await sb.from("shop_stores").select("*").order("created_at",{ascending:true});if(r.error)return toast(r.error.message);stores=r.data||[];let s=$("storeFilter"),v=s.value;s.innerHTML='<option value="">全部店铺</option>'+stores.filter(x=>x.status!=="disabled").map(x=>`<option value="${x.id}">${esc(x.name||x.store_name)}</option>`).join("");s.value=v}async function refresh(){await loadStores();let r=await sb.from("after_sales_tasks").select("*").order("created_at",{ascending:false});if(r.error)return toast(r.error.message);tasks=r.data||[];let l=await sb.from("evidence_library").select("*").order("created_at",{ascending:false});if(!l.error)library=l.data||[];render()}function storeName(id){let s=stores.find(x=>x.id===id);return s?(s.name||s.store_name||"未命名店铺"):"未关联店铺"}function remain(t){if(t.status==="已完成"||t.submission_status!=="pending")return"已完成 · 倒计时停止";let d=new Date(t.deadline||t.deadline_at)-Date.now();if(Number.isNaN(d))return"未设置";if(d<=0)return"已到期";let s=Math.floor(d/1000),h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60),q=s%60;return`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(q).padStart(2,"0")}`}
function render(){let q=($("search")?.value||"").toLowerCase(),sf=$("storeFilter")?.value||"",st=$("statusFilter")?.value||"",rf=$("riskFilter")?.value||"";let a=tasks.filter(t=>(!q||[t.order_id,t.buyer_name,t.tracking_no,storeName(t.store_id)].join(" ").toLowerCase().includes(q))&&(!sf||t.store_id===sf)&&(!st||t.status===st)&&(!rf||t.risk===rf));$("taskcount").textContent=a.length+" 条";$("allc").textContent=tasks.length;$("pendingc").textContent=tasks.filter(t=>["待处理","协商中"].includes(t.status)).length;$("evidencec").textContent=tasks.filter(t=>t.status==="待举证").length;$("riskc").textContent=tasks.filter(t=>t.risk==="高风险").length;$("monitoring").textContent=tasks.filter(t=>t.monitoring).length;$("libcount").textContent=library.length;let td=new Date().toDateString();$("done").textContent=tasks.filter(t=>t.status==="已完成"&&new Date(t.updated_at||t.created_at).toDateString()===td).length;let u=tasks.filter(t=>t.submission_status==="pending"&&(t.deadline||t.deadline_at)).sort((a,b)=>new Date(a.deadline||a.deadline_at)-new Date(b.deadline||b.deadline_at))[0];$("urgent").textContent=u?remain(u):"—";$("tasklist").innerHTML=a.length?a.map(t=>`<article class="card" onclick="openTask('${t.id}')"><div style="display:flex;justify-content:space-between"><b>${esc(t.order_id||"未填写订单")}</b><span class="pill ${t.risk==="高风险"?"red":""}">${esc(t.risk||"普通")}</span></div><div class="muted">${esc(storeName(t.store_id))} · ${esc(t.buyer_name||"未填写买家")}</div><div style="margin-top:8px"><span class="pill">${esc(t.status||"—")}</span> <span class="muted">${esc(t.tracking_no||"无快递单号")}</span></div><div style="margin-top:8px;font-weight:800;font-size:12px">${esc(remain(t))}</div></article>`).join(""):'<div class="card" style="grid-column:1/-1;text-align:center;padding:28px;color:var(--muted)">暂无匹配的售后任务</div>'}
function resetPassword(){$("modalbox").innerHTML='<h3>设置新密码</h3><input id="np" class="input" type="password" placeholder="新密码"><input id="np2" class="input" style="margin-top:7px" type="password" placeholder="确认新密码"><button class="btn primary" style="margin-top:8px" onclick="savePassword()">保存</button>';$('modal').classList.remove('hidden')}async function savePassword(){let p=$("np").value,c=$("np2").value;if(!strong(p)||p!==c)return toast("密码不符合要求");let r=await sb.auth.updateUser({password:p});if(r.error)return toast(r.error.message);closeModal();toast("密码已更新")}

async function deviceDiagnostic(){if(!session?.user?.id)return toast("当前未检测到登录用户");const key="sar_device_diag_id";let deviceId=localStorage.getItem(key);if(!deviceId||deviceId.length<16){deviceId="WEBTEST-"+crypto.randomUUID().replace(/-/g,"");localStorage.setItem(key,deviceId)}const publicKey="WEB_DIAG_PUBLIC_KEY_"+crypto.randomUUID().replace(/-/g,"")+"ABCDEFGHIJKLMNOPQRSTUVWXYZ";toast("正在测试设备注册…");try{const r=await sb.rpc("security_register_device",{p_device_id:deviceId,p_public_key:publicKey,p_platform:"android",p_app_version:"6.3.0",p_build_number:"1",p_attestation_status:null,p_attestation_details:{source:"web_diagnostic",tested_at:new Date().toISOString()}});if(r.error){alert("设备注册失败\n\n"+(r.error.message||JSON.stringify(r.error)));return}const d=r.data||{};if(d.ok)alert("设备注册成功\n\n设备ID："+deviceId+"\n状态："+JSON.stringify(d));else alert("设备注册被拒绝\n\n"+JSON.stringify(d))}catch(e){alert("设备注册异常\n\n"+(e?.message||String(e)))}}
function newTask(){if(!stores.length)return toast("请先添加店铺");$("modalbox").innerHTML=`<h3>新建售后</h3><div class="grid" style="grid-template-columns:1fr 1fr"><select id="ts">${stores.filter(s=>s.status!=="disabled").map(s=>`<option value="${s.id}">${esc(s.name||s.store_name)}</option>`).join("")}</select><input id="to" class="input" placeholder="订单号"><input id="tb" class="input" placeholder="买家"><input id="tt" class="input" placeholder="快递单号"><select id="ty"><option>退款/售后</option><option>退货退款</option><option>仅退款</option><option>换货</option></select><select id="tr"><option>普通</option><option>高风险</option></select></div><div class="muted" style="margin-top:8px">默认3小时。当前为云端本地流程，不冒充抖店官方自动提交。</div><div class="actions" style="margin-top:9px"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="createTask()">创建</button></div>`;$("modal").classList.remove("hidden")}
async function createTask(){let d=new Date(Date.now()+10800000).toISOString(),row={user_id:session.user.id,store_id:$("ts").value,order_id:$("to").value.trim(),buyer_name:$("tb").value.trim(),tracking_no:$("tt").value.trim(),after_sales_type:$("ty").value,risk:$("tr").value,status:"待举证",submission_status:"pending",deadline:d,deadline_at:d,monitoring:!!$("tt").value};let r=await sb.from("after_sales_tasks").insert(row).select().single();if(r.error)return toast(r.error.message);closeModal();await refresh();openTask(r.data.id)}function quickReject(){if(!stores.length)return toast("请先添加店铺");$("modalbox").innerHTML=`<h3>记录拒绝协商</h3><select id="qs">${stores.filter(s=>s.status!=="disabled").map(s=>`<option value="${s.id}">${esc(s.name||s.store_name)}</option>`).join("")}</select><input id="qo" class="input" style="margin-top:7px" placeholder="订单号"><input id="qb" class="input" style="margin-top:7px" placeholder="买家"><textarea id="qm" class="input" style="margin-top:7px" rows="3" placeholder="拒绝原因"></textarea><div class="actions" style="margin-top:8px"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="createReject()">保存</button></div>`;$("modal").classList.remove("hidden")}async function createReject(){let d=new Date(Date.now()+10800000).toISOString();let r=await sb.from("after_sales_tasks").insert({user_id:session.user.id,store_id:$("qs").value,order_id:$("qo").value.trim(),buyer_name:$("qb").value.trim(),status:"买家拒绝协商",risk:"高风险",evidence_reason:$("qm").value.trim(),submission_status:"pending",deadline:d,deadline_at:d}).select().single();if(r.error)return toast(r.error.message);await sb.from("after_sales_events").insert({user_id:session.user.id,task_id:r.data.id,event_type:"buyer_rejected_negotiation",message:$("qm").value.trim()});closeModal();await refresh();openTask(r.data.id)}
async function openTask(id){let t=tasks.find(x=>x.id===id);if(!t)return toast("售后不存在");current=t;let ev=await sb.from("after_sales_events").select("*").eq("task_id",id).order("created_at",{ascending:false});let fs=await sb.from("evidence_files").select("*").eq("task_id",id).order("created_at",{ascending:false});$("sheettitle").textContent=t.order_id||"售后详情";$("sheetsub").textContent=storeName(t.store_id)+" · "+(t.buyer_name||"未填写买家");let files=(fs.data||[]).map(f=>`<div class="file"><div><b>${esc(f.file_name||"举证文件")}</b><div class="muted">${esc(f.mime_type||"文件")}</div></div><div class="actions"><button class="btn blue" onclick="previewEvidence('${f.id}')">打开</button><button class="btn danger" onclick="removeEvidence('${f.id}')">移除</button></div></div>`).join("");let events=(ev.data||[]).map(e=>`<div class="file"><div><b>${esc(e.event_type||"事件")}</b><div class="muted">${fmt(e.created_at)}</div></div><span class="muted">${esc(e.message||"")}</span></div>`).join("");$("detail").innerHTML=`<div class="card"><div class="muted">状态</div><b>${esc(t.status||"—")}</b><div class="muted" style="margin-top:8px">倒计时</div><b>${esc(remain(t))}</b><div class="muted" style="margin-top:8px">快递</div><b>${esc(t.tracking_no||"—")}</b></div><div class="actions"><button class="btn primary" onclick="submitTask('${id}')">提交完成</button><button class="btn" onclick="tracking('${id}')">快递盯单</button><button class="btn" onclick="markArbitration('${id}')">记录仲裁</button><button class="btn blue" onclick="uploadEvidenceClick('${id}')">上传举证</button><button class="btn" onclick="openLibrary('${id}')">调用资料</button><button class="btn danger" onclick="deleteTask('${id}')">删除</button></div><input id="evidenceInput" type="file" multiple accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx,.txt" style="display:none" onchange="uploadEvidenceFiles(this.files,'${id}')"><div class="card" style="margin-top:9px"><b>举证材料</b>${files||'<div class="notice" style="margin-top:8px">暂无举证材料</div>'}</div><div class="card"><b>时间线</b>${events||'<div class="notice" style="margin-top:8px">暂无事件</div>'}</div>`;$("drawer").classList.remove("hidden")}
function uploadEvidenceClick(){let i=$("evidenceInput");if(!i)return toast("文件选择器加载失败");i.value="";i.click()}async function uploadEvidenceFiles(files,id){if(!files?.length)return;let ok=0;for(const f of [...files]){let safe=f.name.replace(/[^\w.\-\u4e00-\u9fa5]/g,"_"),path=`${session.user.id}/tasks/${id}/${crypto.randomUUID()}-${safe}`;let up=await sb.storage.from("after-sales-evidence").upload(path,f,{contentType:f.type||"application/octet-stream"});if(up.error)continue;let db=await sb.from("evidence_files").insert({user_id:session.user.id,task_id:id,file_name:f.name,mime_type:f.type||"application/octet-stream",size_bytes:f.size,storage_path:path});if(db.error)await sb.storage.from("after-sales-evidence").remove([path]);else ok++}toast("举证上传完成："+ok+" 个");await refresh();openTask(id)}async function previewEvidence(id){let r=await sb.from("evidence_files").select("*").eq("id",id).single();if(r.error)return toast(r.error.message);let u=await sb.storage.from("after-sales-evidence").createSignedUrl(r.data.storage_path,600);if(u.error)return toast(u.error.message);window.open(u.data.signedUrl,"_blank")}async function removeEvidence(id){let r=await sb.from("evidence_files").select("*").eq("id",id).single();if(r.error)return toast(r.error.message);let d=await sb.from("evidence_files").delete().eq("id",id);if(d.error)return toast(d.error.message);if(!r.data.library_id&&r.data.storage_path)await sb.storage.from("after-sales-evidence").remove([r.data.storage_path]);await refresh();if(current)openTask(current.id);toast("已移除举证材料")}async function submitTask(id){let f=await sb.from("evidence_files").select("id").eq("task_id",id);if(f.error)return toast(f.error.message);if(!f.data?.length)return toast("请先上传或调用举证材料");let r=await sb.from("after_sales_tasks").update({status:"已完成",submission_status:"submitted_manual",updated_at:new Date().toISOString()}).eq("id",id);if(r.error)return toast(r.error.message);await sb.from("after_sales_events").insert({user_id:session.user.id,task_id:id,event_type:"submitted_local",message:"云端本地提交完成，倒计时停止"});await refresh();openTask(id);toast("提交成功，倒计时已停止")}async function markArbitration(id){let r=await sb.from("after_sales_tasks").update({status:"仲裁中",arbitration_status:"manual",updated_at:new Date().toISOString()}).eq("id",id);if(r.error)return toast(r.error.message);await sb.from("after_sales_events").insert({user_id:session.user.id,task_id:id,event_type:"arbitration",message:"手动记录进入仲裁"});await refresh();openTask(id)}async function tracking(id){let t=tasks.find(x=>x.id===id),n=prompt("输入/修改快递单号",t?.tracking_no||"");if(!n)return;let on=confirm("确定开启持续盯单？");let r=await sb.from("after_sales_tasks").update({tracking_no:n.trim(),monitoring:on,updated_at:new Date().toISOString()}).eq("id",id);if(r.error)return toast(r.error.message);await sb.from("tracking_records").upsert({user_id:session.user.id,task_id:id,tracking_no:n.trim(),monitoring:on,updated_at:new Date().toISOString()},{onConflict:"task_id"});await refresh();openTask(id)}async function deleteTask(id){if(!confirm("确定删除这个售后？"))return;let r=await sb.from("after_sales_tasks").delete().eq("id",id);if(r.error)return toast(r.error.message);closeDrawer();await refresh();toast("售后已删除")}
async function openLibrary(taskId=null){let r=await sb.from("evidence_library").select("*").order("created_at",{ascending:false});if(r.error)return toast(r.error.message);library=r.data||[];let rows=library.map(f=>`<div class="file"><div><b>${esc(f.file_name)}</b><div class="muted">${esc(f.platform||"通用")} · 使用 ${Number(f.usage_count||0)} 次</div></div><div class="actions"><button class="btn blue" onclick="previewLibrary('${f.id}')">打开</button>${taskId?`<button class="btn primary" onclick="useLibraryFile('${f.id}','${taskId}')">用于当前售后</button>`:""}</div></div>`).join("");$("modalbox").innerHTML=`<div class="actions" style="justify-content:space-between"><b>云端资料库</b><button class="btn" onclick="closeModal()">关闭</button></div><button class="btn primary" style="margin:10px 0" onclick="libraryUploadClick()">＋ 上传到资料库</button><input id="libraryInput" type="file" multiple accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx,.txt" style="display:none" onchange="uploadLibraryFiles(this.files)">${rows||'<div class="notice">资料库暂无文件</div>'}`;$("modal").classList.remove("hidden")}function libraryUploadClick(){let i=$("libraryInput");if(i){i.value="";i.click()}}async function uploadLibraryFiles(files){if(!files?.length)return;let ok=0;for(const f of [...files]){let safe=f.name.replace(/[^\w.\-\u4e00-\u9fa5]/g,"_"),path=`${session.user.id}/library/${crypto.randomUUID()}-${safe}`;let up=await sb.storage.from("after-sales-evidence").upload(path,f,{contentType:f.type||"application/octet-stream"});if(up.error)continue;let db=await sb.from("evidence_library").insert({user_id:session.user.id,platform:"通用",file_name:f.name,mime_type:f.type||"application/octet-stream",size_bytes:f.size,storage_path:path});if(db.error)await sb.storage.from("after-sales-evidence").remove([path]);else ok++}toast("资料库上传完成："+ok+" 个");openLibrary()}async function useLibraryFile(id,taskId){let r=await sb.from("evidence_library").select("*").eq("id",id).single();if(r.error)return toast(r.error.message);let f=r.data,x=await sb.from("evidence_files").insert({user_id:session.user.id,task_id:taskId,library_id:id,file_name:f.file_name,mime_type:f.mime_type,size_bytes:f.size_bytes,storage_path:f.storage_path});if(x.error)return toast(x.error.message);await sb.from("evidence_library").update({usage_count:Number(f.usage_count||0)+1}).eq("id",id);closeModal();await refresh();openTask(taskId);toast("资料已加入当前售后")}async function previewLibrary(id){let r=await sb.from("evidence_library").select("*").eq("id",id).single();if(r.error)return toast(r.error.message);let u=await sb.storage.from("after-sales-evidence").createSignedUrl(r.data.storage_path,600);if(u.error)return toast(u.error.message);window.open(u.data.signedUrl,"_blank")}
async function openStore(){let r=await sb.from("shop_stores").select("*").order("created_at",{ascending:false});if(r.error)return toast(r.error.message);let a=r.data||[];$("modalbox").innerHTML=`<div class="actions" style="justify-content:space-between"><b>我的店铺</b><button class="btn" onclick="closeModal()">关闭</button></div><button class="btn primary" style="margin:10px 0" onclick="addStore()">＋ 添加店铺</button>${a.map(s=>`<div class="file"><div><b>${esc(s.name||s.store_name||"未命名")}</b><div class="muted">${esc(s.platform||"抖店")} · ${esc(s.status||"active")}</div></div><button class="btn" onclick="toggleStore('${s.id}','${s.status==="disabled"?"active":"disabled"}')">${s.status==="disabled"?"启用":"停用"}</button></div>`).join("")||'<div class="notice">还没有店铺</div>'}`;$("modal").classList.remove("hidden")}async function addStore(){let n=prompt("输入店铺名称");if(!n?.trim())return;let r=await sb.from("shop_stores").insert({user_id:session.user.id,name:n.trim(),platform:"抖店",status:"active"});if(r.error)return toast(r.error.message);await refresh();openStore()}async function toggleStore(id,status){let r=await sb.from("shop_stores").update({status,updated_at:new Date().toISOString()}).eq("id",id);if(r.error)return toast(r.error.message);await refresh();openStore()}
function more(){$("modalbox").innerHTML=`<div class="actions" style="justify-content:space-between"><b>更多功能</b><button class="btn" onclick="closeModal()">关闭</button></div><div class="grid" style="margin-top:10px"><button class="btn" onclick="openStore()">店铺中心</button><button class="btn" onclick="openLibrary()">云端资料库</button><button class="btn" onclick="refresh();closeModal()">同步云端数据</button><button class="btn" onclick="deviceDiagnostic()">设备注册诊断</button>${isAdmin?'<button class="btn blue" onclick="adminPanel()">管理后台</button>':""}<button class="btn danger" onclick="logout()">退出账号</button></div>`;$("modal").classList.remove("hidden")}
function adminPanel(){if(!isAdmin)return toast("没有管理员权限");$("modalbox").innerHTML='<div class="actions" style="justify-content:space-between"><b>管理员后台</b><button class="btn" onclick="closeModal()">关闭</button></div><div class="actions" style="margin-top:10px"><button class="btn blue" onclick="adminUsers()">用户</button><button class="btn blue" onclick="adminTasks()">售后</button><button class="btn blue" onclick="adminTracking()">快递</button></div><div id="adminBody" style="margin-top:10px"></div>';$('modal').classList.remove('hidden');adminUsers()}async function adminUsers(){let r=await sb.rpc("admin_list_users");if(r.error)return $("adminBody").innerHTML='<div class="notice">'+esc(r.error.message)+'</div>';$("adminBody").innerHTML='<div style="overflow:auto"><table><tr><th>邮箱</th><th>注册</th><th>最后登录</th></tr>'+((r.data||[]).map(x=>`<tr><td>${esc(x.email||"—")}</td><td>${fmt(x.created_at)}</td><td>${fmt(x.last_sign_in_at)}</td></tr>`).join(""))+'</table></div>'}async function adminTasks(){let r=await sb.rpc("admin_list_all_tasks");if(r.error)return $("adminBody").innerHTML='<div class="notice">'+esc(r.error.message)+'</div>';$("adminBody").innerHTML='<div style="overflow:auto"><table><tr><th>订单</th><th>用户</th><th>状态</th><th>风险</th></tr>'+((r.data||[]).map(x=>`<tr><td>${esc(x.order_id||"—")}</td><td>${esc(x.owner_email||"—")}</td><td>${esc(x.status||"—")}</td><td>${esc(x.risk||"—")}</td></tr>`).join(""))+'</table></div>'}async function adminTracking(){let r=await sb.rpc("admin_list_tracking");if(r.error)return $("adminBody").innerHTML='<div class="notice">'+esc(r.error.message)+'</div>';$("adminBody").innerHTML='<div style="overflow:auto"><table><tr><th>快递</th><th>用户</th><th>订单</th><th>盯单</th></tr>'+((r.data||[]).map(x=>`<tr><td>${esc(x.tracking_no||"—")}</td><td>${esc(x.owner_email||"—")}</td><td>${esc(x.order_id||"—")}</td><td>${x.monitoring?"是":"否"}</td></tr>`).join(""))+'</table></div>'}
function presenceStart(){if(!session)return;if(presence)sb.removeChannel(presence);presence=sb.channel("after-sales-presence",{config:{presence:{key:session.user.id}}});presence.on("presence",{event:"sync"},()=>{let state=presence.presenceState(),ids=new Set();Object.values(state).flat().forEach(x=>{if(x.user_id)ids.add(x.user_id)});$("online").textContent=String(ids.size)});presence.subscribe(async st=>{if(st==="SUBSCRIBED")await presence.track({user_id:session.user.id,online_at:new Date().toISOString()})})}init();
</script></body></html>
