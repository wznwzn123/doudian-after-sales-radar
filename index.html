<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
<meta content="#0b1020" name="theme-color"/>
<title>售后雷达 Pro 5.0 · 云端工作台</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        brand: { 50:'#eef2ff',100:'#e0e7ff',500:'#4d72d7',600:'#3f5fc4',700:'#344ea8' },

      },
      boxShadow: {
        'soft': '0 6px 24px -6px rgba(36,56,90,.08)',

<style>
:root{
  --bg:#f4f7fb;--surface:rgba(255,255,255,.82);--surface-solid:#fff;--text:#202636;--muted:#737c8d;
  --line:rgba(148,163,184,.18);--blue:#4d72d7;--blue-soft:#edf2ff;--green:#23a06b;--red:#dd5861;--amber:#b88322;
  --shadow:0 14px 34px rgba(36,56,90,.08);--shadow-soft:0 6px 18px rgba(36,56,90,.06);--radius:22px;
}
html.dark{
  --bg:#111522;--surface:rgba(27,32,48,.84);--surface-solid:#1b2030;--text:#edf2fb;--muted:#9aa4b7;--line:rgba(148,163,184,.16);
  --blue:#85a2ff;--blue-soft:#263252;--green:#47c58d;--red:#ff8088;--amber:#dfba63;--shadow:0 14px 34px rgba(0,0,0,.22);--shadow-soft:0 6px 18px rgba(0,0,0,.16);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 12% 0%,rgba(190,207,247,.28),transparent 28%),linear-gradient(180deg,#f7f9fd 0%,var(--bg) 42%,#eef2f8 100%);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
html.dark body{background:radial-gradient(circle at 12% 0%,rgba(75,96,165,.18),transparent 28%),linear-gradient(180deg,#161a28 0%,var(--bg) 52%,#0f1320 100%)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.hide-scrollbar::-webkit-scrollbar{display:none}.hide-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
.top{position:sticky;top:0;z-index:30;background:rgba(247,249,253,.76);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:14px 16px 10px;border-bottom:1px solid rgba(148,163,184,.12)}
html.dark .top{background:rgba(17,21,34,.76)}
.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#eef2ff,#dbe4ff);display:grid;place-items:center;color:#4d72d7;font-weight:950;box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
html.dark .logo{background:linear-gradient(145deg,#2b3350,#222a40);color:#85a2ff}
.iconBtn{width:38px;height:38px;border-radius:50%;background:var(--surface-solid);color:var(--text);border:1px solid var(--line);box-shadow:var(--shadow-soft);display:grid;place-items:center;font-size:16px}
.btn{padding:9px 12px;border-radius:12px;background:#eef1f6;color:#283247;font-weight:800;font-size:13px}
html.dark .btn{background:#262c3d;color:#eef2fb}
.btn.primary{background:#4d72d7;color:#fff}
.btn.blue{background:var(--blue-soft);color:var(--blue)}
.btn.good{background:#e8f7ef;color:#11754a}
.btn.warn{background:#fff4df;color:#8a5b00}
.btn.danger{background:#ffebed;color:#b32e39}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.input,select,textarea{width:100%;border:1px solid rgba(148,163,184,.24);background:var(--surface-solid);color:var(--text);border-radius:12px;padding:10px 11px;outline:0;font-size:14px}
.input:focus,select:focus,textarea:focus{border-color:rgba(76,115,216,.55);box-shadow:0 0 0 4px rgba(76,115,216,.08)}
.modal{position:fixed;inset:0;z-index:70;background:rgba(15,23,42,.42);display:grid;place-items:center;padding:12px}
.modalBox{background:var(--surface-solid);border-radius:22px;width:min(800px,100%);max-height:88vh;overflow:auto;padding:16px}
.drawer{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.42);display:flex;justify-content:flex-end}
.sheet{height:100%;width:min(780px,100%);background:var(--surface-solid);overflow:auto}
.sheetHead{position:sticky;top:0;z-index:3;background:rgba(255,255,255,.88);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:13px 14px;display:flex;justify-content:space-between}
html.dark .sheetHead{background:rgba(27,32,48,.88)}
.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);z-index:100;background:#202738;color:#fff;padding:10px 14px;border-radius:12px;font-size:13px;box-shadow:var(--shadow)}
.section{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:13px;margin-bottom:10px;box-shadow:var(--shadow-soft)}
.section h3{margin:0 0 10px;font-size:14px}
.notice{padding:10px 12px;border-radius:12px;background:#f4f6fa;font-size:12px;color:#5f6c80}
html.dark .notice{background:#242a3a;color:#a8b2c4}
.notice.warn{background:#fff6e4;color:#805800}
.empty{padding:32px 15px;text-align:center;background:var(--surface);border:1px dashed rgba(148,163,184,.35);border-radius:18px;color:var(--muted)}
.tableWrap{overflow:auto}
.adminTable{width:100%;border-collapse:collapse;font-size:12px}
.adminTable th,.adminTable td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.adminTable th{color:var(--muted)}
.adminPill{display:inline-flex;padding:4px 7px;border-radius:999px;background:#e7f8ef;color:#11754a;font-weight:800}
.authmsg{padding:9px;border-radius:10px;font-size:12px;margin:8px 0}
.authmsg.err{background:#fff0f0;color:#a92323}
.authmsg.ok{background:#eaf8f0;color:#11754a}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
@media(max-width:760px){.top{padding:12px 12px 9px}.wrap{padding:10px 10px 110px}}
</style>
</head>
<body>
<!-- ========== 登录视图 ========== -->
<div class="max-w-[440px] mx-auto mt-[7vh] p-6 bg-white dark:bg-slate-900 rounded-3xl shadow-soft" id="loginView">
  <div class="flex items-center gap-3">
    <div class="logo">雷</div>
    <div>
      <div class="text-lg font-black tracking-tight">售后雷达 Pro 5.0</div>
      <div class="text-[11px] text-slate-500">云端售后 · 证据 · 3小时风险管控</div>
    </div>
  </div>
  <h2 class="text-xl font-bold mt-6 mb-1">进入云端工作台</h2>
  <p class="text-sm text-slate-500 mb-4">数据保存到 Supabase 云端，可跨设备继续处理。</p>
  <div class="field mb-3"><label>邮箱</label><input class="input" id="email" type="email"/></div>
  <div class="field mb-3"><label>密码</label><input class="input" id="password" type="password"/></div>
  <div class="field hidden mb-3" id="passwordConfirmWrap"><label>确认密码</label><input class="input" id="passwordConfirm" type="password"/></div>
  <div class="notice mb-3">密码至少8位，含大写、小写、数字和特殊字符。</div>
  <div class="hidden" id="authMsg"></div>
  <div class="flex flex-wrap gap-2 mt-3">
    <button class="btn primary" onclick="login()">登录</button>
    <button class="btn" onclick="register()">注册</button>
    <button class="btn blue" onclick="forgotPassword()">找回密码</button>
  </div>
</div>

<div class="max-w-[440px] mx-auto mt-[7vh] p-6 bg-white dark:bg-slate-900 rounded-3xl shadow-soft hidden" id="resetView">
  <div class="flex items-center gap-3">
    <div class="logo">雷</div>
    <div>
      <div class="text-lg font-black tracking-tight">售后雷达 Pro 5.0</div>
      <div class="text-[11px] text-slate-500">安全重置密码</div>
    </div>
  </div>
  <h2 class="text-xl font-bold mt-6 mb-3">设置新密码</h2>
  <input class="input mb-3" id="resetPassword" placeholder="新密码" type="password"/>
  <input class="input mb-3" id="resetPasswordConfirm" placeholder="确认新密码" type="password"/>
  <div class="hidden" id="resetMsg"></div>
  <div class="flex gap-2 mt-3">
    <button class="btn primary" onclick="updatePassword()">保存</button>
    <button class="btn" onclick="backToLogin()">返回</button>
  </div>
</div>

<!-- ========== 主应用 ========== -->
<div class="hidden" id="app">
  <header class="top">
    <div class="max-w-[1180px] mx-auto flex justify-between items-center gap-3">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="logo">雷</div>
        <div class="min-w-0">
          <div class="text-[17px] font-black tracking-tight">售后雷达</div>
          <div class="text-[10px] text-slate-500">Pro 5.2 · 云端工作台</div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-[11px] text-slate-500 hidden sm:inline">云端在线 · 在线 <b id="onlineCount">0</b></span>
        <span class="text-[12px] text-slate-500 max-w-[180px] truncate hidden sm:inline" id="userEmail"></span>
        <button class="iconBtn" onclick="toggleTheme()" title="夜间模式">◐</button>
        <button class="iconBtn" onclick="openSettings()" title="设置">⚙</button>
        <button class="btn hidden" id="adminStoreBtn" onclick="adminStoreCenter()">全平台店铺</button>
        <button class="btn ghost hidden" id="adminBtn" onclick="openAdminPanel()">管理后台</button>
        <button class="btn ghost hidden sm:inline" onclick="openSettings()">设置</button>
        <button class="btn ghost hidden sm:inline" onclick="signOut()">退出</button>
      </div>
    </div>
  </header>

  <main class="max-w-[1180px] mx-auto px-3.5 pb-[110px] pt-3.5">
    <!-- Hero -->
    <section class="grid grid-cols-1 lg:grid-cols-[1.25fr_.75fr] gap-3 mb-3">
      <div class="relative overflow-hidden rounded-[26px] p-5 shadow-soft bg-gradient-to-br from-indigo-50 via-indigo-100/70 to-blue-50 dark:from-slate-800 dark:via-slate-800 dark:to-slate-900 border border-indigo-200/30">
        <div class="absolute w-44 h-44 rounded-full -right-16 -top-18 bg-indigo-300/15"></div>
        <h1 class="relative z-10 text-[22px] font-black tracking-tight">欢迎回来，今天先处理高风险。</h1>
        <p class="relative z-10 text-[12px] text-slate-500 mt-1.5 max-w-[560px] dark:text-slate-400">拒绝协商、仲裁、举证、3小时倒计时与云端资料统一管理。</p>
        <div class="relative z-10 flex flex-wrap gap-2 mt-3">
          <button class="btn primary" onclick="newTask()">＋ 新建售后</button>
          <button class="btn" onclick="quickReject()">记录拒绝协商</button>
          <button class="btn blue" onclick="refreshAll()">↻ 同步云端</button>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-2.5">
        <div class="bg-white/80 dark:bg-slate-900/80 border border-slate-200/40 dark:border-slate-700/40 rounded-2xl p-3.5 shadow-card">
          <div class="text-[11px] text-slate-500">最紧急任务</div>
          <div class="text-xl font-black mt-0.5" id="urgent">—</div>
        </div>
        <div class="bg-white/80 dark:bg-slate-900/80 border border-slate-200/40 dark:border-slate-700/40 rounded-2xl p-3.5 shadow-card">
          <div class="text-[11px] text-slate-500">今日完成</div>
          <div class="text-xl font-black mt-0.5" id="doneToday">0</div>
        </div>
        <div class="bg-white/80 dark:bg-slate-900/80 border border-slate-200/40 dark:border-slate-700/40 rounded-2xl p-3.5 shadow-card">
          <div class="text-[11px] text-slate-500">盯单中</div>
          <div class="text-xl font-black mt-0.5" id="monitoring">0</div>
        </div>
        <div class="bg-white/80 dark:bg-slate-900/80 border border-slate-200/40 dark:border-slate-700/40 rounded-2xl p-3.5 shadow-card">
          <div class="text-[11px] text-slate-500">云端资料</div>
          <div class="text-xl font-black mt-0.5" id="evidenceCount">0</div>
        </div>
      </div>
    </section>

    <!-- 统计卡片 -->
    <section class="grid grid-cols-2 md:grid-cols-4 gap-2.5 mb-3">
      <div class="bg-white/80 dark:bg-slate-900/80 border border-slate-200/40 dark:border-slate-700/40 rounded-2xl p-3.5 shadow-card">
        <div class="text-xl font-black" id="cAll">0</div>
        <div class="text-[11px] text-slate-500 mt-0.5">全部售后</div>
      </div>
      <div class="bg-white/80 dark:bg-slate-900/80 border border-slate-200/40 dark:border-slate-700/40 rounded-2xl p-3.5 shadow-card">
        <div class="text-xl font-black" id="cPending">0</div>
        <div class="text-[11px] text-slate-500 mt-0.5">待处理</div>
      </div>
      <div class="bg-white/80 dark:bg-slate-900/80 border border-slate-200/40 dark:border-slate-700/40 rounded-2xl p-3.5 shadow-card">
        <div class="text-xl font-black" id="cEvidence">0</div>
        <div class="text-[11px] text-slate-500 mt-0.5">待举证</div>
      </div>
      <div class="bg-white/80 dark:bg-slate-900/80 border border-slate-200/40 dark:border-slate-700/40 rounded-2xl p-3.5 shadow-card">
        <div class="text-xl font-black text-rose-500" id="cRisk">0</div>
        <div class="text-[11px] text-slate-500 mt-0.5">高风险</div>
      </div>
    </section>

    <!-- 快速筛选 -->
    <div class="flex gap-1.5 overflow-auto hide-scrollbar mb-3">
      <button class="btn" onclick="openStoreCenter()">店铺中心</button>
      <button class="btn" onclick="openLibrary()">云端资料库</button>
      <button class="btn active bg-[#4d72d7] text-white" onclick="setQuickFilter('')">全部</button>
      <button class="btn" onclick="setQuickFilter('risk')">高风险</button>
      <button class="btn" onclick="setQuickFilter('待举证')">待举证</button>
      <button class="btn" onclick="setQuickFilter('仲裁中')">仲裁中</button>
      <button class="btn" onclick="setQuickFilter('已完成')">已完成</button>
    </div>

    <!-- 标题 + 工具栏 -->
    <div class="flex items-center justify-between gap-2.5 mb-2.5 px-0.5">
      <div>
        <div class="text-[15px] font-black">售后任务</div>
        <div class="text-[12px] text-slate-500">所有店铺统一展示</div>
      </div>
      <span class="text-[11px] text-slate-500 bg-slate-200/50 dark:bg-slate-700/40 px-2 py-1 rounded-full font-bold" id="taskCountPill">0 条</span>
    </div>

    <div class="bg-white/80 dark:bg-slate-900/80 border border-slate-200/40 dark:border-slate-700/40 rounded-2xl p-2.5 grid grid-cols-2 md:grid-cols-[minmax(0,1fr)_150px_125px_125px] gap-2 shadow-card mb-2.5">
      <input class="input col-span-2 md:col-span-1" id="search" oninput="render()" placeholder="搜索订单号、买家、店铺…"/>
      <select id="storeFilter" onchange="render()"><option value="">全部店铺</option></select>
      <select id="filter" onchange="render()"><option value="">全部状态</option><option>待处理</option><option>协商中</option><option>买家拒绝协商</option><option>待举证</option><option>仲裁中</option><option>已完成</option></select>
      <select id="riskFilter" onchange="render()"><option value="">全部风险</option><option>普通</option><option>高风险</option></select>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5" id="list"></div>
  </main>

  <!-- 底部导航 -->
  <nav class="fixed left-1/2 bottom-3 -translate-x-1/2 w-[min(650px,calc(100%-24px))] z-40 grid grid-cols-5 gap-1 p-1.5 bg-white/85 dark:bg-slate-900/85 border border-slate-200/20 dark:border-slate-700/30 shadow-float backdrop-blur-xl rounded-[27px]">
    <button class="active bg-indigo-50 dark:bg-indigo-900/40 text-brand rounded-[19px] py-1.5 text-[10px] font-extrabold flex flex-col items-center justify-center gap-0.5" onclick="goDashboard()"><span class="text-lg leading-none">⌂</span><span>仪表盘</span></button>
    <button class="bg-transparent text-slate-500 rounded-[19px] py-1.5 text-[10px] font-extrabold flex flex-col items-center justify-center gap-0.5" onclick="openStoreCenter()"><span class="text-lg leading-none">▱</span><span>店铺</span></button>
    <button class="bg-transparent text-slate-500 rounded-[19px] py-1.5 text-[10px] font-extrabold flex flex-col items-center justify-center gap-0.5" onclick="goAfterSales()"><span class="text-lg leading-none">◎</span><span>售后</span></button>
    <button class="bg-transparent text-slate-500 rounded-[19px] py-1.5 text-[10px] font-extrabold flex flex-col items-center justify-center gap-0.5" onclick="openLibrary()"><span class="text-lg leading-none">▤</span><span>资料库</span></button>
    <button class="bg-transparent text-slate-500 rounded-[19px] py-1.5 text-[10px] font-extrabold flex flex-col items-center justify-center gap-0.5" onclick="openSettings()"><span class="text-lg leading-none">＋</span><span>更多</span></button>
  </nav>
</div>

<!-- 抽屉 / 模态 / Toast -->
<div class="drawer hidden" id="drawer" onclick="if(event.target===this)closeTask()">
  <section class="sheet">
    <div class="sheetHead">
      <div><b id="sheetTitle">售后详情</b><div class="text-[12px] text-slate-500" id="sheetSub"></div></div>
      <button class="btn" onclick="closeTask()">关闭</button>
    </div>
    <div class="p-3.5" id="detailBody"></div>
  </section>
</div>
<div class="modal hidden" id="modal"><div class="modalBox" id="modalBox"></div></div>
<div class="toast hidden" id="toast"></div>

<script>
const CONFIG={SUPABASE_URL:"https://bdnazzywqqmliqyhhtig.supabase.co",SUPABASE_KEY:"sb_publishable_AUD55Xac5eZXmNtcblkgcQ_Y4D-MYk9"};
const sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_KEY);
let session=null,tasks=[],current=null,timer=null,rt=null,presenceChannel=null,isAdmin=false,fileCache=[],eventsCache=[],quick="";
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=v=>v?new Date(v).toLocaleString("zh-CN",{hour12:false}):"—";
const strong=p=>p.length>=8&&/[A-Z]/.test(p)&&/[a-z]/.test(p)&&/\d/.test(p)&&/[^A-Za-z0-9]/.test(p);
function toast(s,type=""){const e=$("toast");e.textContent=s;e.className="toast "+type;e.classList.remove("hidden");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.add("hidden"),2800)}
function msg(id,s,ok=false){$(id).className="authmsg "+(ok?"ok":"err");$(id).textContent=s}
async function login(){const email=$("email").value.trim(),password=$("password").value;if(!email||!password)return msg("authMsg","请输入邮箱和密码");const {error}=await sb.auth.signInWithPassword({email,password});if(error)msg("authMsg",error.message)}
async function register(){const e=$("email").value.trim(),p=$("password").value,c=$("passwordConfirm").value;$("passwordConfirmWrap").classList.remove("hidden");if(!e)return msg("authMsg","请输入邮箱");if(!strong(p))return msg("authMsg","密码不符合要求");if(p!==c)return msg("authMsg","两次密码不一致");const {error}=await sb.auth.signUp({email:e,password:p});if(error)msg("authMsg",error.message);else msg("authMsg","注册成功，请检查邮箱验证。",true)}
async function forgotPassword(){const e=$("email").value.trim();if(!e)return msg("authMsg","请输入邮箱");const {error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.href.split("#")[0]});if(error)msg("authMsg",error.message);else msg("authMsg","重置邮件已发送。",true)}
async function updatePassword(){const p=$("resetPassword").value,c=$("resetPasswordConfirm").value;if(!strong(p))return msg("resetMsg","密码不符合要求");if(p!==c)return msg("resetMsg","两次密码不一致");const {error}=await sb.auth.updateUser({password:p});if(error)msg("resetMsg",error.message);else{msg("resetMsg","密码已更新。",true);setTimeout(backToLogin,900)}}
function backToLogin(){$("resetView").classList.add("hidden");$("loginView").classList.remove("hidden")}
async function checkAdmin(){const {data,error}=await sb.rpc("is_admin");isAdmin=!error&&data===true;$("adminBtn").classList.toggle("hidden",!isAdmin)}
async function init(){const r=await sb.auth.getSession();session=r.data.session;if(session)showApp();else $("loginView").classList.remove("hidden");sb.auth.onAuthStateChange((event,s)=>{session=s;if(event==="PASSWORD_RECOVERY"){$("loginView").classList.add("hidden");$("app").classList.add("hidden");$("resetView").classList.remove("hidden");return}if(s)showApp();else{tasks=[];$("app").classList.add("hidden");$("loginView").classList.remove("hidden")}})}
async function showApp(){$("loginView").classList.add("hidden");$("resetView").classList.add("hidden");$("app").classList.remove("hidden");$("userEmail").textContent=session.user.email;await checkAdmin();$("adminStoreBtn")?.classList.toggle("hidden",!isAdmin);await refreshAll();subscribe();startPresence();startTimer()}
async function signOut(){stopPresence();if(rt)sb.removeChannel(rt);await sb.auth.signOut()}

function startPresence(){
  if(!session)return;
  if(presenceChannel){sb.removeChannel(presenceChannel);presenceChannel=null}
  presenceChannel=sb.channel("after-sales-presence",{config:{presence:{key:session.user.id}}});
  presenceChannel.on("presence",{event:"sync"},updateOnlineCount);
  presenceChannel.on("presence",{event:"join"},updateOnlineCount);
  presenceChannel.on("presence",{event:"leave"},updateOnlineCount);
  presenceChannel.subscribe(async status=>{
    if(status==="SUBSCRIBED"){await presenceChannel.track({user_id:session.user.id,online_at:new Date().toISOString()});updateOnlineCount();}
  });
}
function updateOnlineCount(){
  if(!presenceChannel)return;
  const state=presenceChannel.presenceState();
  const ids=new Set();
  Object.keys(state||{}).forEach(k=>{const arr=state[k]||[];arr.forEach(x=>ids.add(x.user_id||k))});
  $("onlineCount").textContent=String(ids.size);
  window.__onlineUsers=[...ids].map(id=>({id}));
}
function stopPresence(){if(presenceChannel){sb.removeChannel(presenceChannel);presenceChannel=null}if($("onlineCount"))$("onlineCount").textContent="0"}

/* 管理后台 Pro：总览 / 用户 / 售后 / 证据 / 快递 / 管理员 / 日志 / 设置 */
let adminTab='overview';
async function openAdminPanel(){
 if(!isAdmin)return toast('没有管理员权限','err');
 $('modalBox').innerHTML=`<div class="flex flex-wrap gap-1.5 justify-between"><b>售后雷达 Pro · 管理控制台</b><button class="btn" onclick="closeModal()">关闭</button></div><div class="flex gap-1.5 overflow-auto hide-scrollbar my-2.5" id="adminNav"><button class="btn active" onclick="adminTabOpen('overview')">总览</button><button class="btn" onclick="adminTabOpen('users')">用户管理</button><button class="btn" onclick="adminTabOpen('tasks')">售后管理</button><button class="btn" onclick="adminTabOpen('evidence')">证据管理</button><button class="btn" onclick="adminTabOpen('library')">资料库</button><button class="btn" onclick="adminTabOpen('tracking')">快递监控</button><button class="btn" onclick="adminTabOpen('admins')">管理员</button><button class="btn" onclick="adminTabOpen('logs')">操作日志</button><button class="btn" onclick="adminTabOpen('settings')">系统设置</button></div><div id="adminBody"><div class="notice">正在加载…</div></div>`;
 $('modal').classList.remove('hidden');await adminTabOpen('overview');
}
async function adminTabOpen(tab){
 adminTab=tab;document.querySelectorAll('#adminNav .btn').forEach((b,i)=>b.classList.toggle('active',['overview','users','tasks','evidence','library','tracking','admins','logs','settings'][i]===tab));
 const body=$('adminBody');body.innerHTML='<div class="notice">正在读取数据…</div>';
 try{
  if(tab==='overview')return await adminOverview();
  if(tab==='users')return await adminUsers();
  if(tab==='tasks')return await adminTasks();
  if(tab==='evidence')return await adminEvidence();
  if(tab==='library')return await adminLibrary();
  if(tab==='tracking')return await adminTracking();
  if(tab==='admins')return await adminAdmins();
  if(tab==='logs')return await adminLogs();
  if(tab==='settings')return adminSettings();
 }catch(e){body.innerHTML=`<div class="notice warn">读取失败：${esc(e.message||e)}</div>`}
}
async function adminOverview(){
 const [u,t,e,r]=await Promise.all([sb.rpc('admin_list_all_users'),sb.rpc('admin_list_all_tasks'),sb.rpc('admin_list_all_evidence'),sb.rpc('admin_list_tracking')]);
 for(const x of [u,t,e,r])if(x.error)throw x.error;
 const users=u.data||[],tasks=t.data||[],ev=e.data||[],tr=r.data||[];
 $('adminBody').innerHTML=`<div class="grid grid-cols-2 md:grid-cols-4 gap-2.5"><div class="bg-white/80 dark:bg-slate-900/80 border border-slate-200/40 dark:border-slate-700/40 rounded-2xl p-3.5 shadow-card"><div class="text-xl font-black">${users.length}</div><div class="text-[11px] text-slate-500 mt-0.5">注册用户</div></div><div class="bg-white/80 dark:bg-slate-900/80 border border-slate-200/40 dark:border-slate-700/40 rounded-2xl p-3.5 shadow-card"><div class="text-xl font-black">${tasks.length}</div><div class="text-[11px] text-slate-500 mt-0.5">全部售后</div></div><div class="bg-white/80 dark:bg-slate-900/80 border border-slate-200/40 dark:border-slate-700/40 rounded-2xl p-3.5 shadow-card"><div class="text-xl font-black text-rose-500">${tasks.filter(x=>x.risk==='高风险').length}</div><div class="text-[11px] text-slate-500 mt-0.5">高风险</div></div><div class="bg-white/80 dark:bg-slate-900/80 border border-slate-200/40 dark:border-slate-700/40 rounded-2xl p-3.5 shadow-card"><div class="text-xl font-black">${tr.filter(x=>x.monitoring).length}</div><div class="text-[11px] text-slate-500 mt-0.5">盯单中</div></div><div class="bg-white/80 dark:bg-slate-900/80 border border-slate-200/40 dark:border-slate-700/40 rounded-2xl p-3.5 shadow-card"><div class="text-xl font-black">${ev.length}</div><div class="text-[11px] text-slate-500 mt-0.5">证据文件</div></div><div class="bg-white/80 dark:bg-slate-900/80 border border-slate-200/40 dark:border-slate-700/40 rounded-2xl p-3.5 shadow-card"><div class="text-xl font-black">${tasks.filter(x=>x.status==='已完成').length}</div><div class="text-[11px] text-slate-500 mt-0.5">已完成</div></div></div><div class="section mt-2.5"><h3>系统运行概况</h3><div class="notice">管理员控制台已连接云端数据库。这里的数据来自全部用户，而不是当前账号。</div></div>`;
}
async function adminUsers(){
 const {data,error}=await sb.rpc('admin_list_all_users');if(error)throw error;const users=data||[];
 const rows=users.map(u=>`<tr><td><b>${esc(u.email||'—')}</b><div class="text-[11px] text-slate-500">${esc(u.id)}</div></td><td>${fmt(u.created_at)}</td><td>${fmt(u.last_sign_in_at)}</td><td>${Number(u.task_count||0)}</td><td>${u.is_admin?'<span class="adminPill">管理员</span>':'普通用户'}</td></tr>`).join('');
 $('adminBody').innerHTML=`<div class="section"><h3>全部用户</h3><input id="adminUserSearch" class="input" placeholder="搜索邮箱 / 用户ID" oninput="filterAdminTable('adminUserTable',this.value)"><div class="overflow-auto mt-2.5"><table class="adminTable" id="adminUserTable"><thead><tr><th>用户</th><th>注册时间</th><th>最后登录</th><th>售后数</th><th>权限</th></tr></thead><tbody>${rows||'<tr><td colspan="5">暂无用户</td></tr>'}</tbody></table></div></div>`;
}
async function adminTasks(){const {data,error}=await sb.rpc('admin_list_all_tasks');if(error)throw error;const rows=(data||[]).map(t=>`<tr><td>${esc(t.order_id||'—')}</td><td>${esc(t.email||'—')}</td><td>${esc(t.status||'—')}</td><td>${esc(t.risk||'—')}</td><td>${esc(t.tracking_no||'—')}</td><td>${fmt(t.created_at)}</td></tr>`).join('');$('adminBody').innerHTML=`<div class="section"><h3>全站售后任务</h3><div class="overflow-auto"><table class="adminTable"><thead><tr><th>订单</th><th>用户</th><th>状态</th><th>风险</th><th>快递单号</th><th>创建时间</th></tr></thead><tbody>${rows||'<tr><td colspan="6">暂无售后</td></tr>'}</tbody></table></div></div>`}
async function adminEvidence(){const {data,error}=await sb.rpc('admin_list_all_evidence');if(error)throw error;const rows=(data||[]).map(e=>`<tr><td>${esc(e.file_name||'—')}</td><td>${esc(e.email||'—')}</td><td>${esc(e.mime_type||'—')}</td><td>${e.size_bytes?Math.round(e.size_bytes/1024)+' KB':'—'}</td><td>${fmt(e.created_at)}</td></tr>`).join('');$('adminBody').innerHTML=`<div class="section"><h3>全站证据文件</h3><div class="overflow-auto"><table class="adminTable"><thead><tr><th>文件</th><th>用户</th><th>类型</th><th>大小</th><th>上传时间</th></tr></thead><tbody>${rows||'<tr><td colspan="5">暂无证据</td></tr>'}</tbody></table></div></div>`}

async function adminLibrary(){const {data,error}=await sb.rpc('admin_list_library');if(error)throw error;const rows=(data||[]).map(x=>`<tr><td>${esc(x.file_name||'—')}</td><td>${esc(x.email||'—')}</td><td>${esc(x.store_name||'通用')}</td><td>${esc(x.platform||'通用')}</td><td>${Number(x.usage_count||0)}</td><td>${fmt(x.created_at)}</td></tr>`).join('');$('adminBody').innerHTML=`<div class="section"><h3>全站云端资料库</h3><div class="overflow-auto"><table class="adminTable"><thead><tr><th>文件</th><th>用户</th><th>店铺</th><th>平台</th><th>使用次数</th><th>上传时间</th></tr></thead><tbody>${rows||'<tr><td colspan="6">暂无资料</td></tr>'}</tbody></table></div></div>`}
async function adminTracking(){const {data,error}=await sb.rpc('admin_list_tracking');if(error)throw error;const rows=(data||[]).map(t=>`<tr><td>${esc(t.tracking_no||'—')}</td><td>${esc(t.email||'—')}</td><td>${t.monitoring?'<span class="adminPill">盯单中</span>':'已停止'}</td><td>${esc(t.order_id||'—')}</td><td>${fmt(t.created_at)}</td></tr>`).join('');$('adminBody').innerHTML=`<div class="section"><h3>全站快递监控</h3><div class="overflow-auto"><table class="adminTable"><thead><tr><th>快递单号</th><th>用户</th><th>状态</th><th>订单</th><th>记录时间</th></tr></thead><tbody>${rows||'<tr><td colspan="5">暂无记录</td></tr>'}</tbody></table></div></div>`}
async function adminAdmins(){const {data,error}=await sb.rpc('admin_list_users');if(error)throw error;const rows=(data||[]).map(u=>`<tr><td><b>${esc(u.email||'—')}</b><div class="text-[11px] text-slate-500">${esc(u.id)}</div></td><td>${fmt(u.created_at)}</td><td>${fmt(u.last_sign_in_at)}</td><td>${Number(u.task_count||0)}</td><td>${u.id===session.user.id?'<span class="text-[11px] text-slate-500">当前账号</span>':`<button class="btn danger" onclick="adminRemoveUser('${u.id}','${esc(u.email||'该用户')}')">移除</button>`}</td></tr>`).join('');$('adminBody').innerHTML=`<div class="section"><h3>添加管理员</h3><div class="grid grid-cols-2 gap-2.5"><input id="adminEmail" class="input" type="email" placeholder="输入已注册用户邮箱"><button class="btn primary" onclick="adminAddUser()">添加管理员</button></div></div><div class="section"><h3>管理员列表</h3><div class="overflow-auto"><table class="adminTable"><thead><tr><th>邮箱</th><th>注册时间</th><th>最后登录</th><th>售后数</th><th>操作</th></tr></thead><tbody>${rows||'<tr><td colspan="5">暂无管理员</td></tr>'}</tbody></table></div></div>`}
async function adminAddUser(){const email=($('adminEmail')?.value||'').trim().toLowerCase();if(!email)return toast('请输入用户注册邮箱','err');const {data,error}=await sb.rpc('admin_add_user_by_email',{p_email:email});if(error)return toast(error.message||'添加失败','err');if(!data?.ok)return toast(data?.message||'添加失败','err');toast('管理员添加成功','ok');await adminAdmins()}
async function adminRemoveUser(id,email){if(id===session.user.id)return toast('不能移除当前登录管理员','err');if(!confirm('确定移除 '+email+' 的管理员权限？'))return;const {data,error}=await sb.rpc('admin_remove_user',{p_user_id:id});if(error)return toast(error.message||'移除失败','err');if(!data?.ok)return toast(data?.message||'移除失败','err');toast('管理员权限已移除','ok');await adminAdmins()}
async function adminLogs(){const {data,error}=await sb.rpc('admin_list_logs');if(error)throw error;const rows=(data||[]).map(x=>`<tr><td>${fmt(x.created_at)}</td><td>${esc(x.email||'—')}</td><td>${esc(x.action||'—')}</td><td>${esc(x.detail||'—')}</td></tr>`).join('');$('adminBody').innerHTML=`<div class="section"><h3>操作日志</h3><div class="overflow-auto"><table class="adminTable"><thead><tr><th>时间</th><th>用户</th><th>操作</th><th>详情</th></tr></thead><tbody>${rows||'<tr><td colspan="4">暂无日志</td></tr>'}</tbody></table></div></div>`}
function adminSettings(){$('adminBody').innerHTML=`<div class="section"><h3>系统设置</h3><div class="notice">当前版本：售后雷达 Pro 5.0 Admin Console</div><div class="grid grid-cols-2 gap-2.5 mt-2.5"><div><label class="text-[11px] text-slate-500">默认举证时限</label><input class="input" value="3小时" disabled></div><div><label class="text-[11px] text-slate-500">云端同步</label><input class="input" value="Supabase · 已启用" disabled></div></div></div><div class="section"><h3>安全说明</h3><div class="text-[11px] text-slate-500">管理员操作通过数据库 RPC 校验管理员身份。前端隐藏按钮不等于权限控制，真正权限由数据库执行。</div></div>`}
function filterAdminTable(id,q){const x=q.toLowerCase();document.querySelectorAll('#'+id+' tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(x)?'':'none')}

function toggleTheme(){document.documentElement.classList.toggle('dark');try{localStorage.setItem('sar_dark',document.documentElement.classList.contains('dark')?'1':'0')}catch(e){}}
function goDashboard(){window.scrollTo({top:0,behavior:'smooth'});}
function goAfterSales(){const el=document.getElementById('list');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}
try{if(localStorage.getItem('sar_dark')==='1')document.documentElement.classList.add('dark')}catch(e){}

init();
</script>
</body>
