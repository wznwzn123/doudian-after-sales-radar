<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>售后雷达 Pro · 快递盯单版</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}
header{background:#111827;color:#fff;padding:18px 16px}.title{font-size:21px;font-weight:800}.sub{font-size:12px;opacity:.7;margin-top:5px}
main{max-width:980px;margin:auto;padding:14px}.panel{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px #0001}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.card{background:#fff;border-radius:14px;padding:13px;box-shadow:0 2px 10px #0001;cursor:pointer}.num{font-size:23px;font-weight:800}.lab{font-size:12px;color:#6b7280}
.bar{display:grid;grid-template-columns:1fr 130px 130px;gap:8px;margin:12px 0}
input,select,textarea,button{font:inherit;border-radius:10px;padding:10px;border:1px solid #ddd}input,select,textarea{background:#fff;width:100%}button{cursor:pointer;background:#fff}
.primary{background:#2563eb;color:#fff;border:0}.danger{background:#fee2e2;color:#b91c1c;border:0}.small{padding:7px 9px;font-size:12px}
.section-title{font-weight:800;margin-bottom:10px}.formrow{display:grid;grid-template-columns:1fr 130px;gap:8px}.hint{font-size:12px;color:#6b7280;line-height:1.6;margin-top:7px}
.item{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 2px 10px #0001}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.meta{font-size:12px;color:#6b7280;line-height:1.7;margin-top:6px}
.tag{display:inline-block;padding:4px 8px;border-radius:99px;font-size:11px}.red{background:#fee2e2;color:#b91c1c}.orange{background:#ffedd5;color:#c2410c}.green{background:#dcfce7;color:#15803d}.blue{background:#dbeafe;color:#1d4ed8}.gray{background:#f3f4f6;color:#4b5563}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.match{border-left:4px solid #2563eb}.pulse{animation:pulse 1.2s 2}@keyframes pulse{50%{transform:scale(1.01);box-shadow:0 0 0 4px #2563eb22}}
.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:9px 6px;border-bottom:1px solid #eee;text-align:left}.on{color:#15803d}.off{color:#b91c1c}
.modal{display:none;position:fixed;inset:0;background:#0008;padding:20px;align-items:end;z-index:20}.modal.show{display:flex}.sheet{background:#fff;padding:18px;border-radius:18px;width:100%;max-width:720px;margin:auto;max-height:90vh;overflow:auto}
.line{padding:9px 0;border-bottom:1px solid #eee}.empty{text-align:center;padding:28px;color:#9ca3af}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:40}.toast.show{opacity:1}
@media(max-width:650px){.cards{grid-template-columns:1fr 1fr}.bar{grid-template-columns:1fr 1fr}.bar input{grid-column:1/-1}.formrow{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="title">售后雷达 Pro</div><div class="sub">售后监控中心 · 快递盯单增强版 · 当前为演示数据</div></header>
<main>
<div class="cards">
<div class="card" onclick="setFilter('')"><div class="num" id="all">0</div><div class="lab">全部售后</div></div>
<div class="card" onclick="setFilterEvent('拒绝协商')"><div class="num" id="refuse">0</div><div class="lab">拒绝协商</div></div>
<div class="card" onclick="setFilterEvent('仲裁')"><div class="num" id="arb">0</div><div class="lab">仲裁</div></div>
<div class="card" onclick="setRiskFilter()"><div class="num" id="risk">0</div><div class="lab">高风险</div></div>
</div>

<div class="panel">
  <div class="section-title">📦 快递单号盯单</div>
  <div class="formrow">
    <input id="trackInput" placeholder="手动输入快递单号，例如：SF1234567890">
    <button class="primary" onclick="addTrack()">开始盯单</button>
  </div>
  <div class="hint">录入后会持续检查本地新事件；匹配到相同快递单号时自动关联、提醒，并把对应售后置顶。正式接入抖店后，这里可接官方订单/售后数据。</div>
  <div id="watchList" style="margin-top:12px"></div>
</div>

<div class="panel">
<div class="section-title">🔎 售后事件</div>
<div class="bar">
<input id="q" placeholder="搜索订单号、买家、商品、快递单号…" oninput="render()">
<select id="type" onchange="render()"><option value="">全部类型</option><option>退款</option><option>退货退款</option><option>换货</option></select>
<select id="status" onchange="render()"><option value="">全部状态</option><option>待处理</option><option>处理中</option><option>已处理</option></select>
</div>
<div class="actions" style="margin-bottom:12px">
<button class="primary" onclick="addDemo()">＋模拟新售后</button>
<button onclick="exportData()">导出数据</button>
<button onclick="clearData()">清空数据</button>
</div>
<div id="list"></div>
</div>

<div class="panel">
<div class="section-title">⚙️ 盯单规则</div>
<div class="hint">演示版每 10 秒自动扫描一次本地数据；没有真实物流/抖店 API 时，不会伪造外部物流查询结果。</div>
<div id="watchStatus" class="hint"></div>
</div>
</main>

<div class="modal" id="modal"><div class="sheet">
<div class="row"><h3 style="margin:0">售后详情</h3><button onclick="closeModal()">关闭</button></div>
<div id="detail"></div>
<textarea id="note" rows="4" placeholder="内部处理备注…" style="margin-top:10px"></textarea>
<div class="actions"><button class="primary" onclick="saveNote()">保存备注</button><button onclick="markDone()">标记已处理</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const DATA_KEY="radar_after_sales_v2";
const TRACK_KEY="radar_watch_tracks_v1";
let data=JSON.parse(localStorage.getItem(DATA_KEY)||"null")||[
{id:"AS001",order:"731928450012345",buyer:"张先生",product:"轻薄防晒外套",type:"退款",event:"拒绝协商",risk:"高风险",amount:129,status:"待处理",time:"2026-10-05 14:32",reason:"买家拒绝协商",tracking:"SF1234567890",note:""},
{id:"AS002",order:"731928450012346",buyer:"李女士",product:"无线耳机 Pro",type:"退货退款",event:"仲裁",risk:"高风险",amount:299,status:"处理中",time:"2026-10-05 13:18",reason:"平台介入仲裁",tracking:"YT9876543210",note:""},
{id:"AS003",order:"731928450012347",buyer:"王先生",product:"运动水杯",type:"退款",event:"新增售后",risk:"普通",amount:49,status:"待处理",time:"2026-10-05 12:05",reason:"商品与描述不符",tracking:"JD1122334455",note:""},
{id:"AS004",order:"731928450012348",buyer:"陈女士",product:"蓝牙键盘",type:"换货",event:"新增售后",risk:"关注",amount:159,status:"已处理",time:"2026-10-05 10:44",reason:"键盘按键异常",tracking:"SF5555666677",note:"已联系买家确认换货"}
];
let tracks=JSON.parse(localStorage.getItem(TRACK_KEY)||"[]");
let current=null, lastMatched={};

function save(){localStorage.setItem(DATA_KEY,JSON.stringify(data));localStorage.setItem(TRACK_KEY,JSON.stringify(tracks))}
function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2800)}
function norm(v){return String(v||"").replace(/\s+/g,"").toUpperCase()}
function addTrack(){
 let v=norm(document.getElementById("trackInput").value);
 if(!v){toast("请输入快递单号");return}
 if(!tracks.some(x=>x.no===v)) tracks.unshift({no:v,addedAt:new Date().toLocaleString("zh-CN",{hour12:false}),matches:0,active:true});
 document.getElementById("trackInput").value=""; save(); scan(); renderWatch(); render(); toast("已开始盯单："+v)
}
function removeTrack(no){tracks=tracks.filter(x=>x.no!==no);save();renderWatch();render()}
function toggleTrack(no){let x=tracks.find(a=>a.no===no);if(x)x.active=!x.active;save();renderWatch()}
function scan(){
 let changed=false;
 tracks.forEach(w=>{
   if(!w.active)return;
   const matched=data.filter(x=>norm(x.tracking)===w.no);
   const ids=matched.map(x=>x.id).join("|");
   if(ids && lastMatched[w.no]!==ids){w.matches=matched.length;lastMatched[w.no]=ids;changed=true;toast("🎯 匹配到售后："+w.no);matched.forEach(x=>x._matchedAt=new Date().toLocaleString("zh-CN",{hour12:false}));}
   else if(!ids) w.matches=0;
 });
 if(changed) save();
 renderWatch();render();
}
function renderWatch(){
 const el=document.getElementById("watchList");
 if(!tracks.length){el.innerHTML='<div class="empty">还没有盯单。输入快递单号即可开始。</div>';document.getElementById("watchStatus").textContent="当前盯单数：0";return}
 el.innerHTML=tracks.map(w=>{
   const m=data.filter(x=>norm(x.tracking)===w.no);
   return `<div class="item ${m.length?'match':''}">
    <div class="row"><div><b>${w.no}</b> <span class="tag ${w.active?'green':'gray'}">${w.active?'监控中':'已暂停'}</span></div><div class="s">匹配 ${m.length} 条</div></div>
    <div class="meta">开始时间：${w.addedAt}${m.length?' · 已发现关联售后':''}</div>
    ${m.length?m.slice(0,3).map(x=>`<div class="meta">↳ ${x.event} · ${x.product} · ${x.status} · 订单 ${x.order}</div>`).join(""):""}
    <div class="actions"><button class="small" onclick="toggleTrack('${w.no}')">${w.active?'暂停':'继续'}</button><button class="small" onclick="filterTrack('${w.no}')">查看匹配</button><button class="small danger" onclick="removeTrack('${w.no}')">移除</button></div>
   </div>`
 }).join("");
 document.getElementById("watchStatus").textContent="当前盯单数："+tracks.filter(x=>x.active).length+"（每10秒自动扫描一次）";
}
function filterTrack(no){document.getElementById("q").value=no;document.getElementById("type").value="";document.getElementById("status").value="";render()}
function setFilter(v){document.getElementById("q").value=v;render()}
function setFilterEvent(v){data.sort((a,b)=>(b.event===v)-(a.event===v));render();document.querySelector(".panel:nth-of-type(2)").scrollIntoView({behavior:"smooth"})}
function setRiskFilter(){data.sort((a,b)=>(b.risk==="高风险")-(a.risk==="高风险"));render()}
function render(){
 const q=norm(document.getElementById("q").value),t=document.getElementById("type").value,s=document.getElementById("status").value;
 document.getElementById("all").textContent=data.length;
 document.getElementById("refuse").textContent=data.filter(x=>x.event==="拒绝协商").length;
 document.getElementById("arb").textContent=data.filter(x=>x.event==="仲裁").length;
 document.getElementById("risk").textContent=data.filter(x=>x.risk==="高风险").length;
 let arr=data.filter(x=>(!q||norm(JSON.stringify(x)).includes(q))&&(!t||x.type===t)&&(!s||x.status===s));
 document.getElementById("list").innerHTML=arr.length?arr.map(x=>{
   const watched=tracks.some(w=>w.active&&w.no===norm(x.tracking));
   return `<div class="item ${watched?'match':''}">
    <div class="row"><div><b>${esc(x.product)}</b> ${watched?'<span class="tag blue">盯单匹配</span>':''}</div><span class="tag ${x.risk==="高风险"?"red":x.risk==="关注"?"orange":"green"}">${x.risk}</span></div>
    <div class="meta">订单 ${x.order}<br>快递 ${x.tracking||"未录入"}<br>买家 ${esc(x.buyer)}　¥${x.amount}<br>${x.time} · ${x.event} · ${x.type} · ${x.status}</div>
    <div class="actions"><button onclick="show('${x.id}')">详情/备注</button><button onclick="status('${x.id}','处理中')">处理中</button><button class="primary" onclick="status('${x.id}','已处理')">已处理</button></div>
   </div>`
 }).join(""):'<div class=item>没有符合条件的售后</div>'
}
function show(id){current=data.find(x=>x.id===id);document.getElementById("detail").innerHTML=`<h4>基本信息</h4>`+
 [["订单号",current.order],["买家",current.buyer],["商品",current.product],["快递单号",current.tracking],["类型",current.type],["事件",current.event],["风险",current.risk],["金额","¥"+current.amount],["状态",current.status],["时间",current.time],["原因",current.reason]].map(a=>`<div class=line><b>${a[0]}：</b>${esc(a[1])}</div>`).join("");
document.getElementById("note").value=current.note||"";document.getElementById("modal").className="modal show"}
function closeModal(){document.getElementById("modal").className="modal";current=null}
function saveNote(){current.note=document.getElementById("note").value;save();render();closeModal()}
function markDone(){current.status="已处理";save();render();closeModal()}
function status(id,s){const x=data.find(a=>a.id===id);if(x){x.status=s;save();render();toast("状态已更新")}}
function addDemo(){
 const n=Date.now(), watched=tracks.filter(x=>x.active)[0];
 const tracking=watched?watched.no:("SF"+String(n).slice(-10));
 data.unshift({id:"AS"+n,order:String(n),buyer:"演示买家",product:"演示商品·新售后",type:["退款","退货退款","换货"][Math.floor(Math.random()*3)],event:["新增售后","拒绝协商","仲裁"][Math.floor(Math.random()*3)],risk:Math.random()<.4?"高风险":"普通",amount:Math.floor(Math.random()*400)+29,status:"待处理",time:new Date().toLocaleString("zh-CN",{hour12:false}),reason:"模拟生成",tracking,note:""});
 save();scan();toast("已模拟新增售后"+(watched?"，并故意匹配当前盯单":""))
}
function exportData(){const pack={exportedAt:new Date().toISOString(),tracks,data};const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(pack,null,2)],{type:"application/json"}));a.download="售后雷达_盯单与售后数据.json";a.click()}
function clearData(){if(confirm("确定清空全部演示售后和盯单数据？")){data=[];tracks=[];save();renderWatch();render();toast("已清空")}}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
renderWatch();render();scan();setInterval(scan,10000);
</script>
</body></html>
