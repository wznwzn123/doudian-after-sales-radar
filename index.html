ss="card" style="margin-top:9px"><b>流程</b><div class="actions" style="margin-top:8px"><button class="btn" onclick="markArbitration('${id}')">记录仲裁</button><button class="btn blue" onclick="tracking('${id}')">快递盯单</button><button class="btn good" onclick="submitTask('${id}')">提交完成</button><button class="btn danger" onclick="deleteTask('${id}')">删除</button></div></div><div class="card" style="margin-top:9px"><b>时间线</b>${(ev.data||[]).map(e=>`<div class="notice" style="margin-top:6px"><b>${esc(e.event_type)}</b><br>${esc(e.message)}<br>${fmt(e.created_at)}</div>`).join('')||'<div class="muted">暂无事件</div>'}</div>`;$('drawer').classList.remove('hidden')}async function removeEvidence(id){let r=await sb.from('evidence_files').delete().eq('id',id);if(r.error)return toast(r.error.message);openTask(current.id)}async function submitTask(id){let f=await sb.from('evidence_files').select('id').eq('task_id',id);if(!f.data?.length)return toast('请先调用举证材料');let r=await sb.from('after_sales_tasks').update({status:'已完成',submission_status:'submitted_manual',updated_at:new Date().toISOString()}).eq('id',id);if(r.error)return toast(r.error.message);await sb.from('after_sales_events').insert({user_id:session.user.id,task_id:id,event_type:'submitted_local',message:'云端本地提交完成，倒计时停止'});await refresh();openTask(id)}async function markArbitration(id){let r=await sb.from('after_sales_tasks').update({status:'仲裁中',arbitration_status:'manual',updated_at:new Date().toISOString()}).eq('id',id);if(r.error)return toast(r.error.message);await sb.from('after_sales_events').insert({user_id:session.user.id,task_id:id,event_type:'arbitration',message:'手动记录进入仲裁'});await refresh();openTask(id)}async function tracking(id){let t=tasks.find(x=>x.id===id),n=prompt('输入/修改快递单号',t?.tracking_no||'');if(!n)return;let on=confirm('确定开启持续盯单？');let r=await sb.from('after_sales_tasks').update({tracking_no:n.trim(),monitoring:on,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)return toast(r.error.message);await sb.from('tracking_records').insert({user_id:session.user.id,task_id:id,tracking_no:n.trim(),monitoring:on});await refresh();openTask(id)}async function deleteTask(id){if(!confirm('确定删除这个售后？'))return;let r=await sb.from('after_sales_tasks').delete().eq('id',id);if(r.error)return toast(r.error.message);closeDrawer();await refresh()}
async function openLibrary(taskId=null){let r=await sb.from('evidence_library').select('*').order('created_at',{ascending:false});if(r.error)return toast(r.error.message);library=r.data||[];$('modalbox').innerHTML=`<b>云端资料库</b><div class="card" style="margin-top:9px"><input type="file" multiple accept="image/*,video/*,.pdf,.doc,.docx,.txt" onchange="uploadLibrary(this.files)"><div class="muted" style="margin-top:6px">原文件只上传一次，同一资料可被多个售后调用。</div></div>${library.map(f=>`<div class="file"><div><b>${esc(f.file_name)}</b><div class="muted">${esc(f.platform||'通用')} · 使用 ${f.usage_count||0} 次</div></div><div class="actions"><button class="btn blue" onclick="previewLibrary('${f.id}')">打开</button>${taskId?`<button class="btn primary" onclick="useLibrary('${f.id}','${taskId}')">调用</button>`:''}<button class="btn danger" onclick="deleteLibrary('${f.id}')">删除</button></div></div>`).join('')||'<div class="notice">暂无资料</div>'}<button class="btn" style="margin-top:8px" onclick="closeModal()">关闭</button>`;$('modal').classList.remove('hidden')}async function uploadLibrary(list){for(let f of [...list]){let p=`${session.user.id}/library/${crypto.randomUUID()}-${f.name.replace(/[^\w.\-\u4e00-\u9fa5]/g,'_')}`,u=await sb.storage.from('after-sales-evidence').upload(p,f,{contentType:f.type||'application/octet-stream'});if(u.error)return toast(u.error.message);let x=await sb.from('evidence_library').insert({user_id:session.user.id,file_name:f.name,mime_type:f.type||'',size_bytes:f.size,storage_path:p,platform:'通用',usage_count:0});if(x.error){await sb.storage.from('after-sales-evidence').remove([p]);return toast(x.error.message)}}toast('资料已保存');openLibrary()}async function previewLibrary(id){let r=await sb.from('evidence_library').select('*').eq('id',id).single(),u;if(r.error)return toast(r.error.message);u=await sb.storage.from('after-sales-evidence').createSignedUrl(r.data.storage_path,600);if(u.error)return toast(u.error.message);open(u.data.signedUrl,'_blank')}async function useLibrary(lid,tid){let r=await sb.from('evidence_library').select('*').eq('id',lid).single();if(r.error)return toast(r.error.message);let x=await sb.from('evidence_files').insert({user_id:session.user.id,task_id:tid,library_id:lid,file_name:r.data.file_name,mime_type:r.data.mime_type,size_bytes:r.data.size_bytes,storage_path:r.data.storage_path});if(x.error)return toast(x.error.message);await sb.from('evidence_library').update({usage_count:(r.data.usage_count||0)+1,updated_at:new Date().toISOString()}).eq('id',lid);closeModal();openTask(tid)}async function deleteLibrary(id){let r=await sb.from('evidence_library').select('*').eq('id',id).single();if(r.error)return toast(r.error.message);let refs=await sb.from('evidence_files').select('id').eq('library_id',id);if(refs.data?.length)return toast('这份资料正在被售后引用，先移除引用再删除');if(!confirm('删除原始资料？'))return;let d=await sb.from('evidence_library').delete().eq('id',id);if(d.error)return toast(d.error.message);await sb.storage.from('after-sales-evidence').remove([r.data.storage_path]);openLibrary()}
async function openStore(){let q=($('storeq')?.value||'').toLowerCase(),a=stores.filter(s=>[s.name,s.platform,s.shop_id].join(' ').toLowerCase().includes(q));$('modalbox').innerHTML=`<b>我的店铺</b><div class="card" style="margin-top:9px"><div class="grid" style="grid-template-columns:1fr 110px"><input id="newstore" class="input" placeholder="店铺名称"><button class="btn primary" onclick="addStore()">添加</button></div><div class="muted" style="margin-top:6px">普通用户只能管理自己的店铺。</div></div><input id="storeq" class="input" style="margin-top:9px" value="${esc(q)}" placeholder="搜索店铺名称 / 平台 / 店铺ID" oninput="openStore()"><div class="grid tasks" style="margin-top:9px">${a.map(s=>`<div class="card"><b>${esc(s.name||s.store_name)}</b><div class="muted">${esc(s.platform||'douyin')} · ${esc(s.shop_id||'未绑定ID')}</div><div class="actions" style="margin-top:8px"><button class="btn blue" onclick="editStore('${s.id}')">改名</button><button class="btn danger" onclick="disableStore('${s.id}')">停用</button></div></div>`).join('')||'<div class="notice">暂无店铺</div>'}</div><button class="btn" style="margin-top:9px" onclick="closeModal()">关闭</button>`;$('modal').classList.remove('hidden')}async function addStore(){let n=$('newstore').value.trim();if(!n)return toast('请输入店铺名称');let r=await sb.from('shop_stores').insert({user_id:session.user.id,name:n,platform:'douyin',status:'active'});if(r.error)return toast(r.error.message);await refresh();openStore()}async function editStore(id){let s=stores.find(x=>x.id===id),n=prompt('修改店铺名称',s?.name||'');if(!n)return;let r=await sb.from('shop_stores').update({name:n.trim(),updated_at:new Date().toISOString()}).eq('id',id);if(r.error)return toast(r.error.message);await refresh();openStore()}async function disableStore(id){if(!confirm('停用这个店铺？'))return;let r=await sb.from('shop_stores').update({status:'disabled',updated_at:new Date().toISOString()}).eq('id',id);if(r.error)return toast(r.error.message);await refresh();openStore()}
function more(){$('modalbox').innerHTML='<b>更多</b><div class="grid" style="margin-top:10px"><button class="btn" onclick="openStore()">店铺中心</button><button class="btn" onclick="openLibrary()">云端资料库</button><button class="btn" onclick="toggleDark()">切换深色模式</button></div>';$('modal').classList.remove('hidden')}function toggleDark(){document.body.style.filter=document.body.style.filter?'':'brightness(.9)'}
async function adminPanel(){if(!isAdmin)return toast('没有管理员权限');$('modalbox').innerHTML='<b>管理后台</b><div class="actions" style="margin:9px 0"><button class="btn" onclick="adminOverview()">总览</button><button class="btn" onclick="adminUsers()">用户</button><button class="btn" onclick="adminStores()">店铺</button><button class="btn" onclick="adminTasks()">售后</button><button class="btn" onclick="adminLibrary()">资料库</button><button class="btn" onclick="adminTracking()">快递</button><button class="btn" onclick="adminAdmins()">管理员</button></div><div id="adminbody" class="notice">读取中…</div>';$('modal').classList.remove('hidden');adminOverview()}async function rpc(n,a={}){let r=await sb.rpc(n,a);if(r.error)throw r.error;return r.data||[]}function adminErr(e){$('adminbody').innerHTML='<div class="notice">读取失败：'+esc(e.message)+'</div>'}async function adminOverview(){try{let [u,t,s,l,tr]=await Promise.all([rpc('admin_list_all_users'),rpc('admin_list_all_tasks'),rpc('admin_list_all_stores'),rpc('admin_list_library'),rpc('admin_list_tracking')]);$('adminbody').innerHTML=`<div class="grid stats"><div class="card"><b>${u.length}</b><div class="muted">用户</div></div><div class="card"><b>${t.length}</b><div class="muted">售后</div></div><div class="card"><b>${s.length}</b><div class="muted">店铺</div></div><div class="card"><b>${l.length}</b><div class="muted">资料</div></div></div><div class="notice" style="margin-top:9px">管理员看到全平台数据；普通用户仍由 RLS 隔离。</div>`}catch(e){adminErr(e)}}async function adminUsers(){try{$('adminbody').innerHTML=table(await rpc('admin_list_all_users'),['email','id','created_at','last_sign_in_at','task_count'])}catch(e){adminErr(e)}}async function adminStores(){try{$('adminbody').innerHTML=table(await rpc('admin_list_all_stores'),['store_name','platform','owner_email','shop_id','status','task_count'])}catch(e){adminErr(e)}}async function adminTasks(){try{$('adminbody').innerHTML=table(await rpc('admin_list_all_tasks'),['order_id','store_name','email','status','risk','tracking_no','created_at'])}catch(e){adminErr(e)}}async function adminLibrary(){try{$('adminbody').innerHTML=table(await rpc('admin_list_library'),['file_name','email','store_name','platform','usage_count','created_at'])}catch(e){adminErr(e)}}async function adminTracking(){try{$('adminbody').innerHTML=table(await rpc('admin_list_tracking'),['tracking_no','email','order_id','monitoring','created_at'])}catch(e){adminErr(e)}}async function adminAdmins(){try{$('adminbody').innerHTML='<div class="card"><b>添加管理员</b><div class="grid" style="grid-template-columns:1fr 100px;margin-top:7px"><input id="ae" class="input" placeholder="已注册邮箱"><button class="btn primary" onclick="addAdmin()">添加</button></div></div>'+table(await rpc('admin_list_users'),['email','id','created_at','last_sign_in_at','task_count'])}catch(e){adminErr(e)}}async function addAdmin(){try{let d=await rpc('admin_add_user_by_email',{p_email:$('ae').value.trim().toLowerCase()});toast(d.message||'完成');adminAdmins()}catch(e){toast(e.message)}}function table(a,c){return'<div class="card" style="margin-top:9px;overflow:auto"><table><thead><tr>'+c.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+a.map(r=>'<tr>'+c.map(x=>'<td>'+esc(r[x]===true?'是':r[x]===false?'否':r[x]??'—')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}function closeModal(){$('modal').classList.add('hidden')}function closeDrawer(){$('drawer').classList.add('hidden');current=null}function presenceStart(){presence=sb.channel('after-sales-presence',{config:{presence:{key:session.user.id}}});presence.on('presence',{event:'sync'},()=>{let s=presence.presenceState(),n=new Set();Object.values(s).flat().forEach(x=>n.add(x.user_id));$('online').textContent=n.size});presence.subscribe(async st=>{if(st==='SUBSCRIBED')await presence.track({user_id:session.user.id,online_at:new Date().toISOString()})})}init();
</script></body></html>
