function pickEvidence(kind){if(!current)return;const id=current.id;pickFiles(kind,f=>uploadEvidenceFiles(f,id))}
function pickLibrary(kind){pickFiles(kind,f=>uploadLibraryFiles(f))}
async function previewInline(id,kind){const r=await sb.from(kind==="e"?"evidence_files":"evidence_library").select("*").eq("id",id).single();if(r.error)return toast(r.error.message);const u=await sb.storage.from("after-sales-evidence").createSignedUrl(r.data.storage_path,3600);if(u.error)return toast(u.error.message);const m=r.data.mime_type||"";$("modalbox").innerHTML='<div class="actions" style="justify-content:space-between;margin-bottom:10px"><b>'+esc(r.data.file_name||"预览")+'</b><button class="btn" onclick="closeModal()">关闭</button></div>'+(m.startsWith("video/")?'<video class="preview" controls playsinline src="'+esc(u.data.signedUrl)+'"></video>':'<img class="preview" src="'+esc(u.data.signedUrl)+'">');$("modal").classList.remove("hidden")}
async function deleteLibrary(id,taskId){if(!confirm("删除资料库中的这份文件？已引用到售后的记录会保留。"))return;const f=await sb.from("evidence_library").select("storage_path").eq("id",id).single();if(f.error)return toast(f.error.message);const path=f.data.storage_path;const d=await sb.from("evidence_library").delete().eq("id",id);if(d.error)return toast(d.error.message);let used=0;if(path){const c=await sb.from("evidence_files").select("id",{count:"exact",head:true}).eq("storage_path",path);used=c.count||0;if(!used)await sb.storage.from("after-sales-evidence").remove([path])}toast(used?"资料已从资料库删除（售后仍在引用，文件已保留）":"资料已删除");await refresh();openLibrary(taskId||null)}
/* ---------- 店铺中心：搜索 / 改名 / 停用 ---------- */
function renderStoreList(){const q=($("storeQ")?.value||"").trim().toLowerCase();const a=storeRows.filter(s=>!q||[s.name,s.store_name,s.platform,s.shop_id].join(" ").toLowerCase().includes(q));$("storeList").innerHTML='<div class="muted" style="margin-bottom:4px">共 '+storeRows.length+' 家，显示 '+a.length+' 家</div>'+(a.map(s=>{const n=tasks.filter(t=>t.store_id===s.id).length;return '<div class="file"><div><b>'+esc(s.name||s.store_name||"未命名")+'</b><div class="muted">'+esc(s.platform||"抖店")+' · '+(s.status==="disabled"?"已停用":"正常")+' · 售后 '+n+' 条</div></div><div class="actions"><button class="btn blue" onclick="editStore(\''+s.id+'\')">改名</button><button class="btn '+(s.status==="disabled"?"good":"danger")+'" onclick="toggleStore(\''+s.id+'\',\''+(s.status==="disabled"?"active":"disabled")+'\')">'+(s.status==="disabled"?"启用":"停用")+'</button></div></div>'}).join("")||'<div class="notice">没有找到匹配的店铺</div>')}
async function openStore(){let r=await sb.from("shop_stores").select("*").order("created_at",{ascending:false});if(r.error)return toast(r.error.message);storeRows=r.data||[];$("modalbox").innerHTML='<div class="actions" style="justify-content:space-between"><b>我的店铺</b><button class="btn" onclick="closeModal()">关闭</button></div><button class="btn primary" style="margin:10px 0" onclick="addStore()">＋ 添加店铺</button><input id="storeQ" class="input" placeholder="搜索店铺名称 / 平台 / 店铺ID" oninput="renderStoreList()"><div id="storeList" style="margin-top:8px"></div>';$("modal").classList.remove("hidden");renderStoreList()}
async function editStore(id){const s=storeRows.find(x=>x.id===id);if(!s)return;const n=prompt("修改店铺名称",s.name||s.store_name||"");if(!n||!n.trim())return;const r=await sb.from("shop_stores").update({name:n.trim(),updated_at:new Date().toISOString()}).eq("id",id);if(r.error)return toast(r.error.message);await refresh();openStore();toast("店铺名称已修改")}
/* ---------- 实时同步 / 到期兜底 ---------- */
function scheduleRefresh(reopen){clearTimeout(rfTimer);rfTimer=setTimeout(async()=>{if(!session||!enteredUser)return;await refresh();const a=document.activeElement;const typing=a&&$("drawer").contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);if(reopen&&current&&!$("drawer").classList.contains("hidden")&&!typing)openTask(current.id)},400)}
function subscribeRealtime(){if(!session)return;try{if(rt)sb.removeChannel(rt);const f="user_id=eq."+session.user.id;rt=sb.channel("after-sales-live").on("postgres_changes",{event:"*",schema:"public",table:"after_sales_tasks",filter:f},()=>scheduleRefresh(false)).on("postgres_changes",{event:"*",schema:"public",table:"evidence_files",filter:f},()=>scheduleRefresh(true)).subscribe()}catch(e){}}
function isCountdown(t){return !!t&&t.status==="待举证"&&t.submission_status==="pending"&&!!(t.deadline||t.deadline_at)}
async function processExpired(t){const f=await sb.from("evidence_files").select("id").eq("task_id",t.id);if(f.error)return;const has=!!f.data?.length;const patch=has?{status:"已完成",submission_status:"submitted_auto_local",updated_at:new Date().toISOString()}:{submission_status:"failed_no_evidence",updated_at:new Date().toISOString()};const u=await sb.from("after_sales_tasks").update(patch).eq("id",t.id).eq("submission_status","pending").select("id");if(u.error||!u.data?.length)return;await sb.from("after_sales_events").insert({user_id:session.user.id,task_id:t.id,event_type:has?"deadline_auto_processed":"deadline_failed_no_evidence",message:has?"3小时截止，检测到举证材料，完成本地流程处理":"3小时截止，没有举证材料，未完成本地提交"});await refresh()}
/* 服务端定时任务每分钟处理到期；这里只是兜底：到期 90 秒后仍是 pending 才由前端处理，条件更新保证不会和服务端重复处理 */
async function checkExpired(){if(expRunning||!session||!enteredUser)return;expRunning=true;try{for(const t of [...tasks])if(isCountdown(t)&&Date.now()>=new Date(t.deadline||t.deadline_at).getTime()+90000)await processExpired(t)}finally{expRunning=false}}
function presenceStart(){if(!session)return;if(presence)sb.removeChannel(presence);presence=sb.channel("after-sales-presence",{config:{presence:{key:session.user.id}}});presence.on("presence",{event:"sync"},()=>{let state=presence.presenceState(),ids=new Set();Object.values(state).flat().forEach(x=>{if(x.user_id)ids.add(x.user_id)});window.__onlineUsers=[...ids].map(id=>({id}));$("online").textContent=String(ids.size)});presence.subscribe(async st=>{if(st==="SUBSCRIBED")await presence.track({user_id:session.user.id,online_at:new Date().toISOString()})})}init();
</script></body></html>
